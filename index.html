<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyNaturalClinic</title>

<!-- Saasufy components -->
<script src="https://saasufy.com/node_modules/saasufy-components/socket.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/app-router.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/collection-viewer.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/collection-reducer.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/collection-adder-form.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/collection-deleter.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/model-viewer.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/model-input.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/model-text.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/input-provider.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/input-combiner.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/if-group.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/switch-group.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/render-group.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/confirm-modal.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/oauth-link.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/oauth-handler.js" type="module" defer></script>
<script src="https://saasufy.com/node_modules/saasufy-components/log-out.js" type="module" defer></script>

<style>
  :root{
    --bg:#fbfaf8; --surface:#fff; --text:#23282e; --muted:#6f7680;
    --border:#e6e3de; --accent:#2f6b4f; --accent-soft:#eef4f0;
    --warn:#8a6d1f; --warn-soft:#fdf6e3; --danger:#9b3232; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
  h1{font-size:1.9rem;letter-spacing:-.01em}
  h2{font-size:1.25rem}
  h3{font-size:1rem}
  p{margin:0 0 1rem}
  .wrap{max-width:940px;margin:0 auto;padding:0 20px}
  .muted{color:var(--muted)}
  .small{font-size:.86rem}

  header.site{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  header.site .wrap{display:flex;align-items:center;gap:10px 22px;min-height:60px;flex-wrap:wrap;padding-block:9px}
  .brand{font-weight:650;font-size:1.05rem;color:var(--text);letter-spacing:-.01em}
  .brand span{color:var(--accent)}
  nav.main{display:flex;align-items:center;gap:8px 18px;margin-left:auto;flex-wrap:wrap}
  nav.main a{color:var(--muted);font-size:.9rem}
  nav.main a:hover{color:var(--accent);text-decoration:none}
  nav.main app-router{display:flex;align-items:center}
  nav.main app-router > [slot=viewport]{display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
  nav.main oauth-link,nav.main log-out,
  nav.main oauth-link > [slot=viewport]{display:flex;align-items:center}
  @media(max-width:640px){
    nav.main{margin-left:0;width:100%;gap:8px 14px}
    nav.main app-router > [slot=viewport]{gap:8px 14px}
  }

  .devbar{background:var(--warn-soft);border-bottom:1px solid #eadfbc;color:var(--warn);
    font-size:.82rem;padding:7px 0}
  .devbar code{background:rgba(0,0,0,.05);padding:1px 5px;border-radius:4px;font-size:.95em}

  main{padding:28px 0 70px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:16px}
  .card h2{margin-bottom:.15rem}
  .card .sub{color:var(--muted);font-size:.88rem;margin-bottom:1rem}
  .card h2 + .btn-row{margin-top:.75rem}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.grid2{grid-template-columns:1fr}}

  label.f{display:block;margin-bottom:14px}
  label.f > .lab{display:block;font-size:.82rem;font-weight:600;color:var(--muted);
    margin-bottom:5px;letter-spacing:.01em}
  label.f > .hint{display:block;font-size:.78rem;color:var(--muted);margin-top:4px}

  input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  textarea{min-height:120px;resize:vertical}
  input-provider{display:block}
  model-input input,model-input textarea,model-input select,
  input-provider input,input-provider select{width:100%;font:inherit;color:inherit;
    background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  /* font:inherit hands an input the body's 1.6 line-height, while a select lays its text
     out at normal in a box two pixels taller — which is why the two stood at different
     heights side by side despite identical padding. Trimming the line-height and the
     select's vertical padding brings both to 37px while each still centres its own text;
     an explicit height does not, since a select will not recentre inside one.
     textarea keeps the 1.6. */
  input,model-input input,input-provider input{line-height:normal}
  select,model-input select,input-provider select{padding-top:8px;padding-bottom:8px}
  /* Validation feedback. model-input appends .error-message-container and toggles
     .error / .hidden on it; collection-adder-form uses
     .collection-adder-field-error-container for per-field errors and puts .error or
     .success on its slotted message div. In every case the class lands on the inner
     element, not on the custom-element host. */
  .error-message-container,
  .collection-adder-field-error-container,
  [slot=message].error{color:var(--danger);font-size:.82rem;line-height:1.4;margin:0 0 5px}
  .error-message-container,
  .collection-adder-field-error-container{margin:5px 0 0}
  [slot=message].success{color:var(--accent);font-size:.82rem;line-height:1.4;margin:0 0 5px}
  .error-message-container.hidden,
  .error-message-container:empty,
  .collection-adder-field-error-container:empty{display:none}
  model-input input.error,model-input select.error,model-input textarea.error,
  input.error,select.error,textarea.error{border-color:var(--danger)}
  model-input input.error:focus,model-input select.error:focus,
  model-input textarea.error:focus{outline:2px solid #fbeded}
  model-input input.success,model-input select.success,
  model-input textarea.success{border-color:#cfe2d6}

  /* Both components insert their error element BEFORE the input — model-input
     appends the container first, and collection-adder-form does
     insertBefore(errorDiv, input). Reorder visually with flex rather than moving
     DOM nodes the components own. */
  model-input{display:flex;flex-direction:column}
  model-input > input,model-input > select,model-input > textarea{order:1}
  model-input > .error-message-container{order:2}
  label.f{display:flex;flex-direction:column}
  label.f > .lab{order:0}
  label.f > input,label.f > select,label.f > textarea,
  label.f > model-input,label.f > input-provider{order:1}
  label.f > .collection-adder-field-error-container{order:2}
  label.f > .hint{order:3}
  /* A banner rather than the default line of small text, for a confirmation which
     would otherwise be easy to miss. */
  collection-adder-form.notice > [slot=message].success{background:var(--accent-soft);
    border:1px solid #cfe2d6;border-radius:8px;padding:11px 13px;
    font-size:.9rem;font-weight:550;margin:0 0 16px}

  oauth-link,log-out{display:inline-block}
  oauth-link > [slot=viewport]{display:inline-block}
  .btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn-row > *{margin:0}

  .btn{display:inline-block;background:var(--accent);color:#fff;border:1px solid var(--accent);
    border-radius:8px;padding:9px 16px;font:inherit;font-weight:550;cursor:pointer;width:auto}
  .btn:hover{background:#28593f;text-decoration:none;color:#fff}
  .btn.sec{background:var(--surface);color:var(--text);border-color:var(--border)}
  .btn.sec:hover{background:#f4f2ee;color:var(--text)}
  input[type=submit]{width:auto}

  .pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;
    border:1px solid var(--border);color:var(--muted);background:var(--surface)}
  .pill.ok{color:var(--accent);background:var(--accent-soft);border-color:#cfe2d6}
  .pill.pend{color:var(--warn);background:var(--warn-soft);border-color:#eadfbc}
  .pill.no{color:var(--danger);background:#fbeded;border-color:#f0d5d5}

  ul.check{list-style:none;padding:0;margin:0;counter-reset:ck}
  ul.check li{counter-increment:ck;display:flex;gap:13px;align-items:center;padding:13px 0;
    border-bottom:1px solid var(--border)}
  /* Child combinator: the account step sits inside an if-group viewport, so it is not a
     direct child and keeps its rule. */
  ul.check > li:last-child{border-bottom:0}
  /* width, not just flex-basis: steps wrapped in a switch-group are not flex items
     of the <li>, so the shorthand would not apply and the circle would size to its
     glyph. The wrapper is given the same fixed track so every row indents alike. */
  .mark{flex:0 0 22px;width:22px;height:22px;border-radius:50%;display:grid;
    place-items:center;font-size:.72rem;font-weight:700;
    box-sizing:border-box}
  ul.check li > switch-group{flex:0 0 22px;display:block}
  ul.check li > switch-group > [slot=viewport]{display:block}
  .mark.done{background:var(--accent);color:#fff}
  .mark.todo{background:#efedea;color:var(--muted);border:1px solid var(--border)}
  .mark.todo::before{content:counter(ck)}
  /* Listed profiles have nothing left to tick off, so the row is labelled, not numbered. */
  .ico{flex:0 0 22px;width:22px;height:22px;display:grid;place-items:center;color:var(--accent)}
  .ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .ck-body{flex:1}
  .ck-body .t{font-weight:600}
  .ck-body .d{color:var(--muted);font-size:.86rem}

  .row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--border)}
  .row:first-child{border-top:0}
  .row .grow{flex:1;min-width:0}
  .row .t{font-weight:600}
  .row .d{color:var(--muted);font-size:.86rem}
  collection-deleter{cursor:pointer;color:var(--muted);font-size:1rem;padding:2px 6px;border-radius:6px}
  .row.avail{align-items:center}
  collection-deleter:hover{color:var(--danger);background:#fbeded}

  .empty{color:var(--muted);text-align:center;padding:26px 0;font-size:.9rem}
  .err{color:var(--danger);background:#fbeded;border:1px solid #f0d5d5;border-radius:8px;
    padding:10px 12px;font-size:.86rem;margin-bottom:12px}
  .note{background:var(--accent-soft);border:1px solid #cfe2d6;border-radius:8px;
    padding:12px 14px;font-size:.87rem;margin-bottom:14px}
  .spin{text-align:center;color:var(--muted);padding:22px;font-size:.9rem}

  /* ---- confirm-modal ----------------------------------------------------
     confirm-modal renders an <overlay-modal> into its own LIGHT dom, so the
     slotted content below is styleable with ordinary selectors. The dialog
     chrome lives in overlay-modal's shadow DOM and is reached via ::part().
     Defaults we are overriding: an 800px dialog and an orange (#e37042)
     title bar, neither of which matches this design. */
  confirm-modal{--modal-width:440px}
  overlay-modal::part(overlay-background){background:rgba(35,40,46,.45)}
  overlay-modal::part(dialog){
    border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 16px 40px rgba(0,0,0,.18);overflow:hidden}
  overlay-modal::part(title-bar){
    background:var(--surface);color:var(--text);font-weight:650;
    border-bottom:1px solid var(--border);padding:14px 18px}
  overlay-modal::part(content){padding:18px}
  overlay-modal::part(footer){display:none}
  .confirm-modal-content > div:first-child{color:var(--muted);margin-bottom:18px}
  .confirm-modal-buttons-container{display:flex;gap:10px;justify-content:flex-end}
  .modal-confirm-button,.modal-cancel-button{
    font:inherit;font-weight:550;border-radius:8px;padding:9px 16px;cursor:pointer;width:auto}
  .modal-confirm-button{background:var(--danger);color:#fff;border:1px solid var(--danger)}
  .modal-confirm-button:hover{background:#862b2b}
  .modal-cancel-button{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .modal-cancel-button:hover{background:#f4f2ee}
  @media(max-width:480px){
    .confirm-modal-buttons-container{flex-direction:column-reverse}
    .modal-confirm-button,.modal-cancel-button{width:100%}
  }

  .avatar-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .avatar{width:96px;height:96px;border-radius:50%;flex:0 0 auto;
    border:1px solid var(--border);
    background-color:var(--accent-soft);background-position:center;
    background-size:cover;background-repeat:no-repeat;object-fit:cover}
  .avatar.sm{width:52px;height:52px;align-self:center}
  /* An <img class="avatar"> with an empty src draws nothing and the tinted circle
     shows through, so no markup branch is needed to test for a photo. Its box stays
     96x96 either way, so the text beside it never shifts as the photo loads. */
  .profile-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}

  .hero{padding:44px 0 26px}
  .hero h1{font-size:2.3rem;max-width:18ch}
  .hero p{max-width:56ch;color:var(--muted);font-size:1.03rem}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;display:flex;align-items:center;gap:14px;padding:11px 0}
  .steps li::before{content:counter(s);flex:0 0 26px;height:26px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;
    font-weight:700;font-size:.8rem}
  table.plain{width:100%;border-collapse:collapse;font-size:.9rem}
  table.plain th,table.plain td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  table.plain th{color:var(--muted);font-weight:600;font-size:.8rem}
  .sechead{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
  .sechead h2{margin:0}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .toolbar > *{flex:1;min-width:150px}
  /* The pager slots sit directly in the component's shadow flow, after the
     viewport, so centring is done on the host and undone on the viewport (all
     rendered rows, loader, empty and error states live inside that). */
  collection-viewer.search-results{display:block;text-align:center}
  collection-viewer.search-results > [slot=viewport]{text-align:left;min-height:300px}
  .pager-btn{margin-top:14px}
  .pager-btn[disabled]{opacity:.45;cursor:default}
  .pager-btn[disabled]:hover{background:var(--surface);color:var(--text)}
  .pager-num{display:inline-block;margin:14px 10px 0;color:var(--muted);
    font-size:.86rem;min-width:1.5em;text-align:center}
  /* ---- booking calendar (see README) ---- */
  .cal{border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .cal-title{font-weight:650}
  .cal-nav{width:34px;height:34px;padding:0;font:inherit;line-height:1;cursor:pointer;
    color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px}
  .cal-nav:hover:not([disabled]){background:#f4f2ee}
  .cal-nav[disabled]{opacity:.35;cursor:default}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-col{min-width:0}
  .cal-col-head{text-align:center;padding-bottom:7px;margin-bottom:9px;
    border-bottom:1px solid var(--border)}
  .cal-col-head .dow{display:block;font-size:.72rem;font-weight:600;color:var(--muted)}
  .cal-col-head .dom{display:block;font-size:1.05rem;font-weight:650;line-height:1.3}
  .cal-col-head.today .dom{color:var(--accent)}
  .cal-col-times{display:flex;flex-direction:column;gap:6px}
  .cal-none{text-align:center;color:var(--border);font-size:.9rem}
  .time{width:100%;padding:7px 4px;font:inherit;font-size:.85rem;cursor:pointer;
    color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px}
  .time:hover{color:var(--accent);border-color:var(--accent)}
  .time.sel{color:#fff;background:var(--accent);border-color:var(--accent)}
  .cal-empty{color:var(--muted);text-align:center;font-size:.9rem;padding:20px 0 4px}
  @media(max-width:760px){
    .cal-week{grid-template-columns:1fr;gap:0}
    .cal-col.off{display:none}   /* a column of blank rows is noise on a phone */
    .cal-col{display:flex;gap:14px;align-items:baseline;padding:11px 0;
      border-top:1px solid var(--border)}
    .cal-col:first-child{border-top:0}
    .cal-col-head{flex:0 0 62px;display:flex;gap:7px;align-items:baseline;
      text-align:left;border:0;padding:0;margin:0}
    .cal-col-head .dow,.cal-col-head .dom{display:inline;font-size:.95rem}
    .cal-col-times{flex:1;flex-direction:row;flex-wrap:wrap}
    .time{width:auto;padding:7px 12px}
  }
  .chosen{font-weight:600;margin:0 0 4px}
  .chosen-sub{color:var(--muted);font-size:.86rem;margin:0 0 16px}
  /* Last thing in the card, and .err/.note carry a bottom margin but no top. */
  .request-msg{margin:14px 0 0}
  .request-msg:empty{display:none}
  .booking-auth{border-top:1px solid var(--border);margin-top:4px}
  .pay-total{font-size:1.9rem;font-weight:700;margin:14px 0 2px}
  .booking-done{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:var(--accent-soft);color:var(--accent);
    font-size:1.2rem;margin-bottom:12px}
  .booking-create-status:empty{display:none}
  .appt-actions{margin-top:10px}
  .appt-decline-form{margin-top:10px;max-width:460px}
  .appt-msg{margin-top:10px;font-size:.86rem}
  .appt-msg:empty{display:none}
</style>
</head>
<body>

<!-- The booking a patient picked while anonymous. It has to survive the Keycloak
     round trip, which leaves the origin and comes back as a fresh page load, so it
     lives in sessionStorage (REQ-PAT-2) rather than in a component's state. Defined
     before the callback routing below, which reads it to decide where to land. -->
<script>
  (function () {
    var HELD = 'mnc.pendingBooking';     // the selection, until the Appointment exists
    var BOOKED = 'mnc.bookedAppointment'; // the Appointment, so a reload cannot re-create it

    function read(key) {
      try { return JSON.parse(sessionStorage.getItem(key)) || null; } catch (e) { return null; }
    }
    function write(key, value) {
      try {
        if (value) sessionStorage.setItem(key, JSON.stringify(value));
        else sessionStorage.removeItem(key);
      } catch (e) { /* private browsing; the flow degrades to one page */ }
    }

    window.heldBooking = function () { return read(HELD); };
    window.bookedAppointment = function () { return read(BOOKED); };
    // Exactly one of the two is ever set. A new hold drops the last receipt, or
    // booking the same practitioner twice in a visit would read as already paid; and
    // the hold becomes the receipt in one step once the Appointment exists.
    window.holdBooking = function (booking) { write(BOOKED, null); write(HELD, booking); };
    window.bookingConfirmed = function (appointment) {
      write(BOOKED, appointment);
      write(HELD, null);
    };
  })();
</script>

<!-- Keycloak redirects back to the bare page URL with ?code=...&state=... and no
     fragment, so route to the callback page before app-router first renders. A patient
     who was mid-booking goes to the callback which resumes it; everyone else to the one
     which lands on their dashboard. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.has('code') || !q.has('state')) return;
    location.hash = window.heldBooking() ? '/auth/callback/booking' : '/auth/callback';
  })();
</script>

<!-- #/booking/resume exists because the oauth-handler's success URL is a fixed
     attribute and cannot name the clinician. The held booking can. -->
<script>
  (function () {
    function resume() {
      if (location.hash !== '#/booking/resume') return;
      var held = window.heldBooking();
      location.hash = held ? '/booking/payment/' + held.clinicianId : '/browse';
    }
    window.addEventListener('hashchange', resume);
    resume();
  })();
</script>

<!-- Availability is stored in the practitioner's local time. UTC is derived here, the only
     place with an IANA database. A key is 'D-HH' — UTC day 0-6, UTC hour 00-23. -->
<script>
  (function () {
    var WEEK = 10080;
    var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var FULL_DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday',
                          'Thursday', 'Friday', 'Saturday'];
    var BANDS = { morning: [6, 12], afternoon: [12, 17], evening: [17, 22] };

    // Cached per zone: deriving a week of slots asks for thousands of offsets, and
    // constructing the formatter is the expensive part, not reading it.
    var offsetFormats = {};
    function offsetAt(timeZone, at) {
      try {
        if (!offsetFormats[timeZone]) {
          offsetFormats[timeZone] = new Intl.DateTimeFormat('en-US', {
            timeZone: timeZone, timeZoneName: 'longOffset'
          });
        }
        var parts = offsetFormats[timeZone].formatToParts(at);
        for (var i = 0; i < parts.length; i++) {
          if (parts[i].type !== 'timeZoneName') continue;
          var m = /^GMT([+-])(\d\d):(\d\d)$/.exec(parts[i].value);
          return m ? (m[1] === '-' ? -1 : 1) * (Number(m[2]) * 60 + Number(m[3])) : 0;
        }
      } catch (e) {}
      return 0;
    }

    window.tzOffsetMinutes = offsetAt;

    window.viewerTimeZone = function () {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; }
      catch (e) { return 'UTC'; }
    };

    // One offset for a fixed zone, two for a DST one; January and July straddle
    // every transition. Keys built from both read an hour wide rather than drift.
    window.tzOffsets = function (timeZone) {
      var year = new Date().getUTCFullYear();
      var jan = offsetAt(timeZone, new Date(Date.UTC(year, 0, 15)));
      var jul = offsetAt(timeZone, new Date(Date.UTC(year, 6, 15)));
      return jan === jul ? [jan] : [jan, jul];
    };

    // Every UTC hour bucket a local [start, end) minute-of-week range touches. Walking
    // UTC-aligned buckets keeps this right in the half-hour zones (Adelaide, Darwin).
    window.utcHourKeys = function (start, end, offsets) {
      var seen = {}, out = [];
      for (var i = 0; i < offsets.length; i++) {
        var from = start - offsets[i], to = end - offsets[i];
        for (var m = Math.floor(from / 60) * 60; m < to; m += 60) {
          var u = ((m % WEEK) + WEEK) % WEEK;
          var key = Math.floor(u / 1440) + '-' + ('0' + (Math.floor(u / 60) % 24)).slice(-2);

      return out.sort();
    };

    // 'contains' compiles to a regex match, so the whole set is one term. A key is
    // four characters wide and the delimiter is not in the pattern, so no match can
    // straddle two keys. Kept as a flat, paren-free alternation: collection-view-params
    // splits on `fieldPartsRegExp`, whose `\([^)]*\)` branch cannot nest, so a grouped
    // pattern loses its last `)` before it ever reaches the server.
    window.utcHoursQuery = function (field, keys) {
      var seen = {}, unique = [];
      keys.forEach(function (key) {

      });

    };

    function zoneIsValid(timeZone) {
      if (!timeZone) return false;
      try { new Intl.DateTimeFormat('en-US', { timeZone: timeZone }); return true; }
      catch (e) { return false; }
    }

    // The keys one weekly block contributes, for the hidden field on the adder form.
    // A missing or unrecognised profile timezone must not quietly mean UTC — that files
    // a Sydney practitioner's hours ten hours out. The browser's zone is the better guess.
    window.weeklyKeys = function (day, startMinute, endMinute, timeZone) {
      var zone = zoneIsValid(timeZone) ? timeZone : window.viewerTimeZone();
      return window.utcHourKeys(day * 1440 + startMinute, day * 1440 + endMinute,
                                window.tzOffsets(zone)).join(',');
    };

    // Browse: the viewer's chosen day and band, converted to UTC. Both of the viewer's
    // offsets, for the same reason as the clinician's — the 60-day booking horizon
    // crosses a DST transition, and the query is built once, today.
    window.searchHoursQuery = function (day, band, timeZone) {
      if (!day && !band) return '';
      var span = BANDS[band] || [0, 24];
      var days = day ? [Number(day)] : [0, 1, 2, 3, 4, 5, 6];
      var offsets = window.tzOffsets(timeZone || window.viewerTimeZone());
      var keys = [];
      for (var i = 0; i < days.length; i++) {
        keys = keys.concat(window.utcHourKeys(days[i] * 1440 + span[0] * 60,
                                              days[i] * 1440 + span[1] * 60, offsets));
      }
      return window.utcHoursQuery('utcHours', keys);
    };

    // Which days a practitioner works, read back in the viewer's timezone.
    window.localDaysLabel = function (utcHours) {
      if (!utcHours) return 'No weekly hours listed';
      var offset = offsetAt(window.viewerTimeZone(), new Date());
      var seen = {};
      utcHours.split(',').forEach(function (key) {
        var day = Number(key.slice(0, 1)), hour = Number(key.slice(2));
        if (isNaN(day) || isNaN(hour)) return;
        var local = (((day * 1440 + hour * 60 + offset) % WEEK) + WEEK) % WEEK;
        seen[Math.floor(local / 1440)] = true;
      });
      var label = [1, 2, 3, 4, 5, 6, 0].filter(function (day) { return seen[day]; })
        .map(function (day) { return DAY_NAMES[day]; }).join(' ');
      return label || 'No weekly hours listed';
    };

    window.weekdayName = function (minuteOfWeek) {
      return FULL_DAY_NAMES[Math.floor(minuteOfWeek / 1440) % 7] || '';
    };

    window.clockOf = function (minute) {
      var m = ((minute % 1440) + 1440) % 1440;
      var hour = Math.floor(m / 60), past = m % 60;
      return (hour % 12 || 12) + (past ? ':' + ('0' + past).slice(-2) : '') +
        (hour < 12 ? 'am' : 'pm');
    };

    window.availabilityRange = function (entry) {
      var weekly = entry.kind === 'weekly';
      var start = weekly ? entry.startMinuteOfWeek : entry.startMinuteOfDay;
      var end = weekly ? entry.endMinuteOfWeek : entry.endMinuteOfDay;
      if (start == null || end == null) return '';
      var label = window.clockOf(start) + ' – ' + window.clockOf(end);
      if (weekly && Math.floor(end / 1440) !== Math.floor(start / 1440)) {
        label += ' ' + window.weekdayName(end);
      }
      return label;
    };

    // Keeps the adder form's hidden model fields in step with its visible selects.
    function syncWeeklyForm(form) {
      var read = function (role) {
        var select = form.querySelector('[data-role=' + role + ']');
        return Number(select.options[select.selectedIndex].getAttribute('data-value'));
      };
      var day = read('day'), start = read('start'), end = read('end');
      // An end at or before the start runs into the next day; minute-of-week holds that
      // without splitting the block, which is why it is one axis.
      if (end <= start) end += 1440;
      var startOfWeek = day * 1440 + start, endOfWeek = day * 1440 + end;
      form.querySelector('[name=startMinuteOfWeek]').value = startOfWeek;
      form.querySelector('[name=endMinuteOfWeek]').value = endOfWeek;
      form.querySelector('[name=utcHourKeys]').value =
        window.weeklyKeys(day, start, end, form.getAttribute('data-timezone'));
      var summary = form.querySelector('[data-role=summary]');
      if (summary) {
        var spansDays = Math.floor(endOfWeek / 1440) !== day;
        summary.textContent = 'Saves as ' + window.weekdayName(startOfWeek) + ' ' +
          window.clockOf(startOfWeek) + ' \u2013 ' + window.clockOf(endOfWeek) +
          (spansDays ? ' ' + window.weekdayName(endOfWeek) : '');
      }
    }

    function weeklyFormOf(node) {
      return node && node.closest ? node.closest('.weekly-hours') : null;
    }

    document.addEventListener('change', function (e) {
      var form = weeklyFormOf(e.target);
      if (form) syncWeeklyForm(form);
    });
    // Capture on the submit button rather than the submit event, which does not cross
    // the component's shadow boundary. Also re-reads the selects after a form reset.
    document.addEventListener('click', function (e) {
      if (!e.target || e.target.type !== 'submit') return;
      var form = weeklyFormOf(e.target);
      if (form) syncWeeklyForm(form);
    }, true);
  })();
</script>

<!-- Booking calendar — a week of the clinician's open times, read back in the
     viewer's own zone. Slots are computed from Availability here rather than stored:
     a TimeSlot row exists only once a time is actually taken. See README. -->
<script>
  (function () {
    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                  'August', 'September', 'October', 'November', 'December'];
    var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var FULL_DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday',
                     'Friday', 'Saturday'];
    var DAY_MS = 86400000;
    var SPAN = 7;                    // days per view
    var HORIZON_DAYS = 60;           // REQ-AVAIL-2
    var LEAD_MS = 2 * 3600 * 1000;   // REQ-AVAIL-4

    // Outside the DOM: the reducer re-renders its viewport on every change, which would
    // otherwise drop the selection mid-booking. Keyed on the reducer element, since a
    // fresh one means the page re-rendered and its view params are back at week one.
    var picked = {};
    var sequence = 0;

    // Whole days, not `now`: a bound that moved every render would refetch each time.
    window.dayStartAt = function (offsetDays) {
      var d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + (offsetDays || 0));
      return d.getTime();
    };

    // Only the times already taken are stored, so this is a small set.
    window.slotWeekParams = function (clinicianId, offsetDays) {
      return 'clinicianId=' + clinicianId +
        ',fromAt:number=' + window.dayStartAt(offsetDays) +
        ',toAt:number=' + window.dayStartAt(offsetDays + SPAN) +
        ',query=status contains held|booked';
    };

    function dayKey(date) {
      return date.getFullYear() + '-' + (date.getMonth() + 1) + '-' + date.getDate();
    }

    function clockLabel(date) {
      return window.clockOf(date.getHours() * 60 + date.getMinutes());
    }

    function dateLabel(date) {
      return FULL_DAYS[date.getDay()] + ' ' + date.getDate() + ' ' + MONTHS[date.getMonth()];
    }

    // "Monday 3 November, 9:00 am – 9:30 am", in the viewer's own zone.
    window.slotLabel = function (startAt, endAt) {
      var start = new Date(startAt);
      return dateLabel(start) + ', ' + clockLabel(start) +
        (endAt ? ' – ' + clockLabel(new Date(endAt)) : '');
    };

    window.zoneClock = function (at, zone) {
      try {
        return new Intl.DateTimeFormat('en-AU', {
          timeZone: zone, weekday: 'short', day: 'numeric', month: 'short',
          hour: 'numeric', minute: '2-digit'
        }).format(new Date(at));
      } catch (e) { return ''; }
    };

    // The civil date an instant falls on in `zone`.
    var civilFormats = {};
    function civilIn(zone, at) {
      if (!civilFormats[zone]) {
        civilFormats[zone] = new Intl.DateTimeFormat('en-US', {
          timeZone: zone, year: 'numeric', month: '2-digit', day: '2-digit'
        });
      }
      var out = {};
      civilFormats[zone].formatToParts(new Date(at)).forEach(function (part) {
        if (part.type !== 'literal') out[part.type] = Number(part.value);
      });
      return { y: out.year, m: out.month - 1, d: out.day };
    }

    // A civil time in `zone` as a UTC instant. The first offset lookup can land the
    // wrong side of a DST change, so it is applied and then re-read at the result.
    function instantAt(zone, y, m, d, minute) {
      var naive = Date.UTC(y, m, d, 0, minute);
      var at = naive - window.tzOffsetMinutes(zone, new Date(naive)) * 60000;
      return naive - window.tzOffsetMinutes(zone, new Date(at)) * 60000;
    }

    // Expand the weekly pattern, its blackouts and its one-off openings into concrete
    // instants in [fromAt, toAt). Nothing is written — the browser is where the IANA
    // database is, and a row is only worth storing once the time is taken.
    function instantsFrom(blocks, zone, minutes, fromAt, toAt) {
      if (!minutes || !blocks.length) return [];
      var weekly = [], blackouts = [], extras = [];
      blocks.forEach(function (block) {
        if (block.active === false) return;
        if (block.kind === 'weekly' && block.startMinuteOfWeek != null) weekly.push(block);
        else if (block.kind === 'dayOff' && block.date != null) blackouts.push(block);
        else if (block.kind === 'extra' && block.date != null) extras.push(block);
      });

      var found = [];
      var step = function (block, start, span, limit) {
        for (var at = start; at + minutes <= start + span; at += minutes) {
          var instant = limit(at);
          if (instant == null) continue;
          if (block.effectiveFrom && instant < block.effectiveFrom) continue;
          if (block.effectiveUntil && instant >= block.effectiveUntil) continue;
          if (instant >= fromAt && instant < toAt) found.push(instant);
        }
      };

      // Walk the clinician's own calendar dates, starting a day early so a block
      // running past local midnight is not missed.
      var first = civilIn(zone, fromAt - DAY_MS);
      var cursor = new Date(Date.UTC(first.y, first.m, first.d));
      for (var guard = 0; guard < 400; guard++) {
        var y = cursor.getUTCFullYear(), m = cursor.getUTCMonth(), d = cursor.getUTCDate();
        if (instantAt(zone, y, m, d, 0) >= toAt) break;
        var weekday = cursor.getUTCDay();
        weekly.forEach(function (block) {
          if (Math.floor(block.startMinuteOfWeek / 1440) % 7 !== weekday) return;
          step(block, block.startMinuteOfWeek % 1440,
               block.endMinuteOfWeek - block.startMinuteOfWeek,
               function (at) { return instantAt(zone, y, m, d, at); });
        });
        cursor.setUTCDate(d + 1);
      }
      extras.forEach(function (block) {
        step(block, block.startMinuteOfDay || 0,
             (block.endMinuteOfDay || 0) - (block.startMinuteOfDay || 0),
             function (at) { return block.date + at * 60000; });
      });

      var covered = function (instant) {
        for (var i = 0; i < blackouts.length; i++) {
          var from = blackouts[i].date + (blackouts[i].startMinuteOfDay || 0) * 60000;
          var until = blackouts[i].date +
            (blackouts[i].endMinuteOfDay == null ? 1440 : blackouts[i].endMinuteOfDay) * 60000;
          if (instant >= from && instant < until) return true;
        }
        return false;
      };
      var seen = {};
      return found.filter(function (instant) {
        if (seen[instant] || covered(instant)) return false;
        seen[instant] = true;
        return true;
      }).sort(function (a, b) { return a - b; });
    }

    // The clinician's availability, stashed by the outer reducer for the inner one.
    window.holdBlocks = function (blocks) {
      this.availabilityBlocks = blocks || [];
      return '';
    };

    function openTimes(home, taken) {
      var minutes = Number(home.dataset.minutes);
      var busy = {};
      (taken || []).forEach(function (slot) { busy[slot.startAt] = true; });
      var from = Math.max(Date.now() + LEAD_MS, window.dayStartAt(picked.offset));
      // The last week overlaps the end of the horizon; stop at it, not at the column.
      var to = Math.min(window.dayStartAt(picked.offset + SPAN),
                        window.dayStartAt(HORIZON_DAYS));
      return instantsFrom(home.availabilityBlocks || [], home.dataset.zone, minutes, from, to)
        .filter(function (instant) { return !busy[instant]; })
        .map(function (instant) {
          return { startAt: instant, endAt: instant + minutes * 60000 };
        });
    }

    function weekHTML(byDay) {
      var first = new Date(window.dayStartAt(picked.offset));
      var last = new Date(window.dayStartAt(picked.offset + SPAN - 1));
      var today = dayKey(new Date());
      var columns = [], filled = 0;
      for (var at = 0; at < SPAN; at++) {
        var date = new Date(window.dayStartAt(picked.offset + at));
        var open = byDay[dayKey(date)] || [];
        if (open.length) filled++;
        columns.push('<div class="cal-col' + (open.length ? '' : ' off') + '">' +
          '<div class="cal-col-head' + (dayKey(date) === today ? ' today' : '') + '">' +
          '<span class="dow">' + DOW[date.getDay()] + '</span>' +
          '<span class="dom">' + date.getDate() + '</span></div>' +
          (open.length ?
            '<div class="cal-col-times">' + open.map(function (slot) {
              return '<button type="button" class="time' +
                (slot.startAt === picked.startAt ? ' sel' : '') + '" data-at="' +
                slot.startAt + '">' + clockLabel(new Date(slot.startAt)) + '</button>';
            }).join('') + '</div>' :
            '<div class="cal-none">—</div>') + '</div>');
      }
      var arrow = function (step, glyph, label, off) {
        return '<button type="button" class="cal-nav" data-cal-week="' + step + '"' +
          (off ? ' disabled' : '') + ' aria-label="' + label + '">' + glyph + '</button>';
      };
      var sameMonth = first.getMonth() === last.getMonth();
      return '<div class="cal"><div class="cal-head">' +
        arrow(-SPAN, '‹', 'Previous week', picked.offset <= 0) +
        '<div class="cal-title">' + first.getDate() +
        (sameMonth ? '' : ' ' + MONTHS[first.getMonth()]) + ' – ' + last.getDate() +
        ' ' + MONTHS[last.getMonth()] + ' ' + last.getFullYear() + '</div>' +
        arrow(SPAN, '›', 'Next week', picked.offset + SPAN >= HORIZON_DAYS) +
        '</div><div class="cal-week">' + columns.join('') + '</div>' +
        (filled ? '' : '<div class="cal-empty">Nothing open this week — try the one after.</div>') +
        '</div>';
    }

    function requestCard(source) {
      var page = source.closest('.booking-page');
      return page && page.querySelector('.booking-request');
    }

    function syncRequest(home, slot) {
      var card = requestCard(home);
      if (!card) return;
      // Holding the slot drops it out of the open set; the confirmation must not go
      // with it. Choosing another time thaws this.
      if (card.bookingSent) return;
      card.bookingSlot = slot;
      card.hidden = !slot;
      if (!slot) return;
      var start = new Date(slot.startAt);
      card.querySelector('.chosen').textContent = dateLabel(start) + ', ' +
        clockLabel(start) + ' – ' + clockLabel(new Date(slot.endAt)) +
        ' (' + window.viewerTimeZone() + ')';
      var theirs = window.zoneClock(slot.startAt, home.dataset.zone);
      card.querySelector('.chosen-sub').textContent = theirs ?
        home.dataset.name + ' sees this as ' + theirs + ', ' + home.dataset.zone + '.' : '';
      var message = card.querySelector('.request-msg');
      message.className = 'request-msg';
      message.textContent = '';
      card.querySelector('.request-btn').disabled = false;
      var auth = card.querySelector('.booking-auth');
      if (auth) auth.hidden = true;
    }

    function draw(source) {
      var home = source.closest('.avail-source');
      if (!source.bookingSequence) source.bookingSequence = ++sequence;
      if (picked.sequence !== source.bookingSequence) {
        picked = { sequence: source.bookingSequence, offset: 0 };
      }
      var open = openTimes(home, source.takenSlots);
      var byDay = {};
      open.forEach(function (slot) {
        var key = dayKey(new Date(slot.startAt));
        (byDay[key] = byDay[key] || []).push(slot);
      });
      var chosen = open.filter(function (slot) { return slot.startAt === picked.startAt; })[0];
      if (!chosen) picked.startAt = null;
      syncRequest(home, chosen || null);
      return weekHTML(byDay);
    }

    // `.call(this, Taken)` in the reducer's template hands us the reducer element; the
    // availability and the clinician's details sit on the .avail-source around it.
    window.slotCalendar = function (taken) {
      this.takenSlots = taken;
      return draw(this);
    };

    // Picking a time needs no round trip; changing week asks for one via the view params.
    function redraw(source) {
      var viewport = source.querySelector('[slot=viewport]');
      if (viewport) viewport.innerHTML = draw(source);
    }

    // No email field: Keycloak has a verified address already, and asking twice
    // invites a mismatch between who pays and who the invitation reaches (REQ-PAT-4).
    function sendRequest(button) {
      var card = button.closest('.booking-request');
      var slot = card.bookingSlot;
      var message = card.querySelector('.request-msg');
      var field = function (name) {
        var input = card.querySelector('[name=' + name + ']');
        return input ? input.value.trim() : '';
      };
      if (!slot) return;
      if (!field('patientName')) {
        message.className = 'request-msg err';
        message.textContent = 'Your name is needed — the invitation names you.';
        return;
      }
      // Appointment.intakeReason is capped at 500 characters by the schema. Rejecting
      // it here rather than on the write keeps the only likely non-race failure out of
      // the middle of a sequence which has already claimed the time.
      if (field('intakeReason').length > 500) {
        message.className = 'request-msg err';
        message.textContent = 'That is a little long — 500 characters at most. ' +
          'You can tell ' + card.dataset.name + ' the rest in the consultation.';
        return;
      }

      window.holdBooking({
        clinicianId: card.dataset.clinicianId,
        startAt: slot.startAt,
        endAt: slot.endAt,
        patientName: field('patientName'),
        patientTimezone: window.viewerTimeZone(),
        intakeReason: field('intakeReason')
      });

      // Signed in already: the account is all that was missing, so go straight to
      // payment. Otherwise the Keycloak links below carry on from here, and the hold
      // is what survives the round trip.
      if (window.currentAccountId()) {
        location.hash = '/booking/payment/' + card.dataset.clinicianId;
        return;
      }
      card.bookingSent = true;
      message.className = 'request-msg';
      message.textContent = '';
      button.disabled = true;
      var auth = card.querySelector('.booking-auth');
      if (auth) auth.hidden = false;
    }

    document.addEventListener('click', function (e) {
      if (!e.target.closest) return;
      var hit = e.target.closest('[data-cal-week],[data-at],.request-btn');
      if (!hit) return;
      if (hit.classList.contains('request-btn')) return sendRequest(hit);
      var source = hit.closest('.slot-source');
      if (!source) return;
      var card = requestCard(source);
      if (card) card.bookingSent = false;
      if (hit.hasAttribute('data-cal-week')) {
        var next = picked.offset + Number(hit.getAttribute('data-cal-week'));
        if (next < 0 || next >= HORIZON_DAYS) return;
        picked.offset = next;
        picked.startAt = null;
        source.setAttribute('collection-view-params',
          window.slotWeekParams(source.dataset.clinicianId, next));
      } else {
        picked.startAt = Number(hit.getAttribute('data-at'));
        redraw(source);
      }
    });
  })();
</script>

<!-- Payment and confirmation — the second half of the booking flow. The patient has
     an account by the time either page renders, so unlike the calendar these talk to
     Saasufy directly rather than to the worker. -->
<script>
  (function () {
    function socket() {
      var provider = document.querySelector('socket-provider');
      return provider && provider.saasufySocket;
    }

    window.currentAccountId = function () {
      var s = socket();
      return s && s.authToken ? s.authToken.accountId : null;
    };

    // Polled rather than driven off the authStateChange stream: these pages are
    // reached by a full page load straight after the Keycloak redirect, so the socket
    // may not exist yet either, and there is nothing to listen on.
    function whenAuthenticated(ok, fail) {
      var waited = 0;
      (function tick() {
        var s = socket();
        if (s && s.authState === 'authenticated' && s.authToken) return ok(s);
        if (waited >= 15000) return fail(new Error('You are not signed in.'));
        waited += 150;
        setTimeout(tick, 150);
      })();
    }

    function uuid() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    // A TimeSlot's id is *derived* from (clinicianId, startAt) rather than random, so
    // the primary key is the booking's uniqueness constraint (REQ-AVAIL-3). Two
    // patients racing for the same instant compute the same id, both try to create it,
    // and the database lets exactly one through — which is the serialisation REQ-BOOK-2
    // wants and the reason this flow is safe without a single-writer worker.
    //
    // Anything else which creates a slot — the worker, a migration — must derive the id
    // the same way or the constraint is silently lost. The namespace and the name are
    // therefore a protocol, not an implementation detail: name is exactly
    // `<clinicianId>:<startAt>`, startAt in epoch milliseconds with no padding.
    var SLOT_NAMESPACE = '6f8c1e5a-3b47-4d2e-9a10-5c7e2d9f4b83';

    function uuidv5(namespace, name) {
      var flat = namespace.replace(/-/g, '');
      var nameBytes = new TextEncoder().encode(name);
      var bytes = new Uint8Array(16 + nameBytes.length);
      for (var i = 0; i < 16; i++) bytes[i] = parseInt(flat.substr(i * 2, 2), 16);
      bytes.set(nameBytes, 16);
      return crypto.subtle.digest('SHA-1', bytes).then(function (hash) {
        var h = new Uint8Array(hash).subarray(0, 16);
        h[6] = (h[6] & 0x0f) | 0x50;   // version 5
        h[8] = (h[8] & 0x3f) | 0x80;   // RFC 4122 variant
        var hex = '';
        for (var j = 0; j < 16; j++) hex += (h[j] + 0x100).toString(16).substr(1);
        return [hex.substr(0, 8), hex.substr(8, 4), hex.substr(12, 4),
                hex.substr(16, 4), hex.substr(20)].join('-');
      });
    }

    function slotIdFor(clinicianId, startAt) {
      // crypto.subtle needs a secure context. Dev is localhost and production is
      // https, both of which qualify; anything else must fail loudly rather than fall
      // back to a random id, which would quietly drop the constraint above.
      if (!window.crypto || !crypto.subtle) {
        return Promise.reject(patientError('this browser cannot complete the booking ' +
          'securely. The page must be served over HTTPS.'));
      }
      return uuidv5(SLOT_NAMESPACE, clinicianId + ':' + startAt);
    }

    // Something the patient can act on, as opposed to a failure we only report.
    function patientError(message) {
      var error = new Error(message);
      error.patientFacing = true;
      return error;
    }

    // A write which failed for its own reasons rather than because the booking is
    // impossible. The time is already claimed and both ids are settled, so the right
    // answer is to run the same sequence again, not to unpick what landed.
    function retryableError(error) {
      var next = new Error(error && error.message || 'the service did not answer');
      next.retryable = true;
      return next;
    }

    function esc(text) {
      return String(text == null ? '' : text).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function money(cents) {
      return '$' + ((Number(cents) || 0) / 100).toFixed(2);
    }

    // Both pages describe the same instant the same way: the viewer's zone first,
    // because that is the one they will act on, and the clinician's after it.
    function whenHTML(booking, clinician) {
      var theirs = window.zoneClock(booking.startAt, clinician.timezone);
      return '<p class="chosen">' + esc(window.slotLabel(booking.startAt, booking.endAt)) +
        ' (' + esc(window.viewerTimeZone()) + ')</p>' +
        (theirs ? '<p class="chosen-sub">' + esc(clinician.displayName) +
          ' sees this as ' + esc(theirs) + ', ' + esc(clinician.timezone) + '.</p>' : '');
    }

    function practitionerHTML(clinician) {
      return '<p class="muted" style="margin:0">' + esc(clinician.professionalTitle) + '</p>' +
        '<h2 style="margin:2px 0 10px">' + esc(clinician.displayName) + '</h2>';
    }

    function nothingHeldHTML(what) {
      return '<div class="card"><h2>' + what + '</h2>' +
        '<p class="muted">The time you picked is no longer held in this tab — it is kept ' +
        'only for the length of the visit. Choose a time again and it will take a moment.</p>' +
        '<div class="btn-row"><a class="btn" href="#/browse">Find a practitioner</a></div></div>';
    }

    // ---------------------------------------------------------------- payment

    window.paymentPrompt = function (clinician) {
      var held = window.heldBooking();
      var booked = window.bookedAppointment();
      if (booked && booked.clinicianId === clinician.id) {
        return '<div class="card"><h2>Already paid</h2>' +
          '<p class="muted">This appointment is confirmed.</p>' +
          '<div class="btn-row"><a class="btn" href="#/booking/confirmed/' +
          esc(clinician.id) + '">See the details</a></div></div>';
      }
      if (!held) return nothingHeldHTML('Nothing to pay for');

      var amount = Number(clinician.priceAmount) || 0;
      return '<div class="card">' + practitionerHTML(clinician) + whenHTML(held, clinician) +
        '<p class="muted small">' + esc(clinician.consultationMinutes) +
        ' minutes online, booked for ' + esc(held.patientName) + '.</p>' +
        '<div class="pay-total">' + money(amount) + ' AUD</div>' +
        '<p class="muted small">One payment, inclusive of our fee (REQ-BOOK-7). We hold it ' +
        'and pass it on to ' + esc(clinician.displayName) +
        ' only after the consultation has taken place.</p>' +
        '<div class="btn-row"><a class="btn" href="' + esc(window.PIN_PAYMENTS_URL) +
        '" target="_blank" rel="noopener">Pay ' + money(amount) + ' with Pin Payments</a></div>' +
        '<div class="note"><strong>The checkout is a stand-in.</strong> That link opens a ' +
        'hosted Pin Payments page which knows nothing about this booking and will not send ' +
        'you back here. The Pin.js card form of REQ-BOOK-0 and the webhook which confirms ' +
        'the charge (REQ-BOOK-6) are not built yet, so follow the link below once you are ' +
        'done to see what happens after a real payment.</div>' +
        '<p class="small"><a href="#/booking/confirmed/' + esc(clinician.id) +
        '">I have completed payment &rarr;</a></p>' +
        '</div>';
    };

    // ------------------------------------------------------------ confirmation

    // Writing happens on render, so a re-render — a field change on the clinician
    // record is enough — must not write twice. The flag covers the span before the
    // receipt lands in sessionStorage, which covers everything after it.
    var creating = null;
    var inFlight = null;   // the clinician record a retry would use

    function status(text, className, retry) {
      var node = document.querySelector('.booking-create-status');
      if (!node) return;
      node.className = 'booking-create-status ' + (className || 'muted small');
      node.textContent = text;
      if (!retry) return;
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn sec booking-retry';
      button.textContent = 'Try again';
      node.appendChild(document.createElement('br'));
      node.appendChild(button);
    }

    // The create *is* the lock. The loser of a race gets a duplicate primary key
    // back, and only then is the row read — to decide what to tell them, never to
    // decide whether to write. A read-then-create would reopen the very window the
    // derived id closes.
    function claimSlot(s, accountId, slot) {
      return s.invoke('crud', { action: 'create', type: 'TimeSlot', value: slot })
        .then(function () {
          return { created: true, appointmentId: slot.appointmentId };
        })
        .catch(function (error) {
          return s.invoke('crud', { action: 'read', type: 'TimeSlot', id: slot.id })
            .then(function (existing) {
              if (!existing) throw error;   // a real failure, not a collision
              // Status before ownership. A row released back to 'open' by a
              // cancellation or decline (REQ-INV-4) survives, and nothing here may
              // turn it into a booking again: another patient does not own it, and
              // reviving our own would confirm the cancelled appointment it still
              // names. The worker owns that transition (REQ-BOOK-8).
              if (existing.status !== 'held' && existing.status !== 'booked') {
                throw patientError('that time was released by an earlier booking and ' +
                  'cannot be re-booked here yet. Nothing has been charged.');
              }
              var owners = String(existing.accountId || '').split(',');
              if (owners.indexOf(accountId) >= 0) {
                // Ours, and still live: this page has run before. Carry on with the
                // appointment id the row already names — writing it is idempotent, so
                // a booking which half-finished completes rather than duplicating.
                return { created: false, appointmentId: existing.appointmentId || '' };
              }
              throw patientError('that time was taken while you were paying. ' +
                'Nothing has been charged — choose another time.');
            }, function () { throw error; });
        });
    }

    function createAppointment(held, clinician) {
      whenAuthenticated(function (s) {
        var accountId = s.authToken.accountId;
        var amount = Number(clinician.priceAmount) || 0;
        var fee = Math.round(amount * window.PLATFORM_FEE_RATE);
        // Comma-separated owners: the patient reads their own booking, the clinician
        // reads the invitation. Both models enable multiple owners for this.
        var owners = accountId + ',' + clinician.accountId;

        function appointmentValue(appointmentId, slotId) {
          return {
            id: appointmentId, accountId: owners,
            patientAccountId: accountId, clinicianAccountId: clinician.accountId,
            clinicianId: clinician.id, timeSlotId: slotId,
            startAt: held.startAt, endAt: held.endAt,
            // Not 'paid': the Pin webhook is the only authority on that (REQ-BOOK-6)
            // and it is not wired up, so paymentStatus stays 'none' and the
            // clinician's invitation is what moves next.
            status: 'pending_clinician',
            patientName: held.patientName,
            patientTimezone: held.patientTimezone,
            intakeReason: held.intakeReason || '',
            amount: amount, platformFee: fee, clinicianPayout: amount - fee,
            currency: 'AUD'
          };
        }

        slotIdFor(clinician.id, held.startAt).then(function (slotId) {
          // The slot names its appointment from the moment it is claimed, before that
          // appointment exists. It is a forward reference on purpose: it is what makes
          // a second attempt land on the same row instead of booking a second time.
          var appointmentId = uuid();
          return claimSlot(s, accountId, {
            id: slotId, accountId: owners, clinicianId: clinician.id,
            startAt: held.startAt, endAt: held.endAt, status: 'booked',
            appointmentId: appointmentId,
            priceAmount: amount,
            consultationMinutes: Number(clinician.consultationMinutes) || 0
          }).then(function (claim) {
            var id = claim.appointmentId || appointmentId;
            return s.invoke('crud', {
              action: 'create', type: 'Appointment', value: appointmentValue(id, slotId)
            }).catch(function (error) {
              // It may have landed and only the answer been lost, which a second
              // attempt would otherwise read as a fresh failure.
              return s.invoke('crud', { action: 'read', type: 'Appointment', id: id })
                .then(function (existing) {
                  if (existing) return null;
                  throw retryableError(error);
                }, function () { throw retryableError(error); });
            }).then(function () {
              if (claim.created) return id;
              // An older row with no appointmentId — point it at the one just written.
              return s.invoke('crud', {
                action: 'update', type: 'TimeSlot', id: slotId,
                field: 'appointmentId', value: id
              }).catch(function () {}).then(function () { return id; });
            });
          });
        }).then(function (appointmentId) {
          window.bookingConfirmed({
            appointmentId: appointmentId, clinicianId: clinician.id,
            startAt: held.startAt, endAt: held.endAt, patientName: held.patientName
          });
          seedPatient(s, accountId, held);
          // The appointment exists from here on. Failing to queue the email is a
          // smaller, separate problem and must not read as a failed booking.
          sendInvite(s, appointmentId).then(function () {
            status('Your practitioner has been notified.', 'muted small');
          }).catch(function (error) {
            status('Your appointment is recorded, but ' + error.message +
              '. We will chase it up.', 'err');
          });
        }).catch(function (error) {
          creating = null;
          if (error.patientFacing) {
            return status('Sorry — ' + error.message, 'err');
          }
          if (error.retryable) {
            // The time is held and nothing is lost; only the appointment record is
            // missing, and running the same sequence again writes exactly it.
            return status('Your time is held, but the appointment could not be ' +
              'recorded: ' + error.message + '.', 'err', true);
          }
          status('The appointment could not be recorded: ' + error.message +
            ' Nothing has been charged.', 'err');
        });
      }, function (error) {
        creating = null;
        status(error.message + ' Sign in and come back to this page.', 'err');
      });
    }

    // Their first booking is also where their patient profile comes from, so the
    // dashboard has something to edit. Read first: the name they have already saved
    // there is theirs to change, and this booking's must not overwrite it. Best
    // effort throughout — a profile is not worth failing a paid booking over.
    function seedPatient(s, accountId, held) {
      s.invoke('crud', {
        action: 'read', type: 'Patient', view: 'accountView',
        viewParams: { accountId: accountId }, offset: 0, pageSize: 1
      }).then(function (result) {
        if (result && result.data && result.data.length) return null;
        return s.invoke('crud', {
          action: 'create', type: 'Patient',
          value: {
            accountId: accountId,
            fullName: held.patientName, timezone: held.patientTimezone
          }
        });
      }).catch(function () {});
    }

    // The invite email (§6.6) will be sent from here. The cloud function only logs
    // for now; it verifies this token and refuses an appointment the caller does not
    // own, so a failure here is worth surfacing.
    function sendInvite(s, appointmentId) {
      return fetch(window.SAASUFY_FUNCTIONS_URL + '/appointmentInvite', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + s.signedAuthToken
        },
        body: JSON.stringify({ appointmentId: appointmentId })
      }).then(function (response) {
        if (!response.ok) throw new Error('the invitation could not be queued (HTTP ' +
          response.status + ')');
      });
    }

    window.bookingConfirmation = function (clinician) {
      var booked = window.bookedAppointment();
      var held = window.heldBooking();
      var booking = (booked && booked.clinicianId === clinician.id) ? booked : held;
      if (!booking) return nothingHeldHTML('Nothing to confirm');

      var pending = '';
      if (!booked) {
        inFlight = clinician;
        if (creating !== booking.startAt) {
          creating = booking.startAt;
          setTimeout(function () { createAppointment(booking, clinician); }, 0);
        }
        pending = 'Recording your appointment…';
      }

      return '<div class="card">' +
        '<div class="booking-done">&#10003;</div>' +
        '<h2 style="margin:0 0 4px">Your appointment is scheduled</h2>' +
        '<p class="muted" style="margin:0 0 14px">with ' +
        esc(clinician.professionalTitle) + ' ' + esc(clinician.displayName) + '</p>' +
        whenHTML(booking, clinician) +
        '<p class="muted small">' + esc(clinician.consultationMinutes) +
        ' minutes online. We have emailed ' + esc(clinician.displayName) +
        ' an invitation for this time; you will hear from us as soon as they accept it, ' +
        'and the meeting link arrives with that confirmation.</p>' +
        '<p class="booking-create-status muted small">' + esc(pending) + '</p>' +
        '<div class="btn-row"><a class="btn sec" href="#/dashboard">Your appointments</a>' +
        '<a class="btn sec" href="#/browse">Book another</a></div>' +
        '</div>';
    };

    // Retrying rather than unwinding: the slot is claimed, both ids are settled and
    // every write in the sequence is idempotent, so the same run finishes the job.
    document.addEventListener('click', function (e) {
      if (!e.target || !e.target.closest || !e.target.closest('.booking-retry')) return;
      var held = window.heldBooking();
      if (!held || !inFlight) return;
      creating = held.startAt;
      status('Recording your appointment…', 'muted small');
      createAppointment(held, inFlight);
    });

    // ------------------------------------------------- accept and decline

    // REQ-INV-2's dashboard half. The clinician is an owner of both rows, so both
    // writes are theirs to make and no server-side code is needed for the decision
    // itself — only for the consequences, which is why the refund is not here.
    function apptRow(node) { return node.closest('.appt-row'); }

    function apptMessage(row, text, className) {
      var node = row.querySelector('.appt-msg');
      if (!node) return;
      node.className = 'appt-msg ' + (className || 'muted small');
      node.textContent = text;
    }

    function setBusy(row, busy) {
      ['.appt-accept', '.appt-decline', '.appt-decline-confirm'].forEach(function (sel) {
        var button = row.querySelector(sel);
        if (button) button.disabled = busy;
      });
    }

    function respond(row, decision, reason) {
      var s = socket();
      var id = row.dataset.appointmentId;
      if (!s || !id) return;
      setBusy(row, true);
      apptMessage(row, decision === 'confirmed' ? 'Accepting…' : 'Declining…');

      // Re-read first. The row may have been answered in another tab, or the patient
      // may have cancelled since this page was drawn — and the browser has no way to
      // make the check and the write one atomic step, so the check has to be fresh
      // rather than trusted from the render.
      s.invoke('crud', { action: 'read', type: 'Appointment', id: id, field: 'status' })
        .then(function (current) {
          if (current !== 'pending_clinician') {
            throw new Error('this appointment is no longer waiting on you — it is now ' +
              (current || 'in another state') + '.');
          }
          var value = { status: decision, inviteRespondedAt: Date.now() };
          if (decision === 'declined') value.declineReason = reason || '';
          return s.invoke('crud', { action: 'update', type: 'Appointment', id: id, value: value });
        })
        .then(function () {
          // Status first, slot second, and never the other way round: freeing the time
          // before the appointment is declined would let someone book an instant this
          // clinician is still committed to. A slot left behind is the safe failure.
          if (decision !== 'declined') return null;
          return releaseSlot(s, row);
        })
        .then(function () {
          if (decision === 'confirmed') {
            return apptMessage(row, 'Accepted. The patient can see it now; the meeting ' +
              'link follows once video is wired up.', 'muted small');
          }
          apptMessage(row, 'Declined, and the time is open for booking again. The refund ' +
            'is not automatic yet — it still has to be issued in Pin.', 'note');
        })
        .catch(function (error) {
          setBusy(row, false);
          apptMessage(row, 'Sorry — ' + error.message, 'err');
        });
    }

    // Deleting the row rather than setting it back to 'open': an 'open' slot stays
    // owned by this appointment's two parties, so the next patient's create would
    // collide on the derived id and they could neither take it nor update it. Removing
    // it is what actually makes the instant bookable again. Nothing is lost — the
    // declined Appointment keeps its own startAt and endAt.
    function releaseSlot(s, row) {
      var slotId = row.dataset.timeSlotId;
      if (!slotId) return null;
      return s.invoke('crud', { action: 'delete', type: 'TimeSlot', id: slotId })
        .catch(function () {
          // The decline stands either way; this only leaves a time still showing as
          // taken, which is visible and fixable, so it must not fail the decline.
          apptMessage(row, 'Declined. The time could not be reopened automatically — ' +
            'it may still show as taken.', 'err');
        });
    }

    document.addEventListener('click', function (e) {
      if (!e.target || !e.target.closest) return;
      var hit = e.target.closest('.appt-accept,.appt-decline,.appt-decline-confirm,' +
        '.appt-decline-cancel');
      if (!hit) return;
      var row = apptRow(hit);
      if (!row) return;
      var form = row.querySelector('.appt-decline-form');

      if (hit.classList.contains('appt-accept')) return respond(row, 'confirmed');
      // Declining asks once more, and is where the reason is offered.
      if (hit.classList.contains('appt-decline')) {
        if (form) form.hidden = false;
        return apptMessage(row, '', 'muted small');
      }
      if (hit.classList.contains('appt-decline-cancel')) {
        if (form) form.hidden = true;
        return apptMessage(row, '', 'muted small');
      }
      var input = row.querySelector('[name=declineReason]');
      respond(row, 'declined', input ? input.value.trim() : '');
    });

    // ------------------------------------------------------- dashboard helpers

    var HORIZON_DAYS = 365;

    // Appointment's patientView and clinicianView both range over startAt, so a
    // dashboard list is a window around today rather than a status query. Past
    // appointments stay reachable by asking for the window behind us.
    //
    // The id goes in a param named `accountId` for both views, which is the model's
    // accessModelAuthField: a view over a `restrict` model is only readable if one of
    // its params is that field, and the server checks the value against the caller's
    // own token. Which party column it is matched against is the view's business, not
    // the caller's — so there is nothing to pass but your own id.
    //
    // Whole days rather than `now`, for the same reason as the calendar: a bound that
    // moved on every render would refetch each time. Today's midnight also means an
    // appointment which started an hour ago is still listed as coming up, which is
    // what someone running late needs to see.
    window.appointmentParams = function (accountId, direction, query) {
      var past = direction === 'past';
      return 'accountId=' + accountId +
        ',fromAt:number=' + window.dayStartAt(past ? -HORIZON_DAYS : 0) +
        ',toAt:number=' + window.dayStartAt(past ? 0 : HORIZON_DAYS) +
        ',query=' + (query || '');
    };

    // Every state of §6.5 named explicitly, so a status nobody thought about shows up
    // as itself rather than as a blank.
    var STATES = {
      pending_payment:     ['pend', 'awaiting payment'],
      pending_clinician:   ['pend', 'awaiting the practitioner'],
      confirmed:           ['ok',   'confirmed'],
      declined:            ['no',   'declined'],
      expired:             ['no',   'expired'],
      cancelled_patient:   ['no',   'cancelled by you'],
      cancelled_clinician: ['no',   'cancelled by the practitioner'],
      completed:           ['ok',   'completed'],
      no_show_patient:     ['no',   'you did not attend'],
      no_show_clinician:   ['no',   'the practitioner did not attend'],
      disputed:            ['no',   'disputed']
    };
    var CLINICIAN_STATES = {
      pending_payment:   ['pend', 'awaiting the patient&rsquo;s payment'],
      pending_clinician: ['pend', 'needs your answer'],
      cancelled_patient: ['no',   'cancelled by the patient'],
      no_show_patient:   ['no',   'the patient did not attend'],
      no_show_clinician: ['no',   'you did not attend']
    };

    window.appointmentPill = function (status, audience) {
      var state = (audience === 'clinician' && CLINICIAN_STATES[status]) ||
        STATES[status] || ['', String(status || 'unknown')];
      return '<span class="pill ' + state[0] + '">' + state[1] + '</span>';
    };

    // Rendered through {{ }}, which escapes, so this returns text rather than markup.
    window.appointmentWhen = function (startAt, endAt, zone) {
      return (zone && window.zoneClock(startAt, zone)) ||
        window.slotLabel(startAt, endAt);
    };
  })();
</script>
