              </template>
              <div slot="viewport"></div>
            </oauth-link>
            <oauth-link
              provider="keycloak:dev"
              client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
              redirect-uri="http://localhost:8100/index.html"
              grant-type="authorization_code"
            >
              <template slot="item">
                <a href="https://auth.saasufy.com/realms/tenant/protocol/openid-connect/auth?client_id={{oauth.clientId}}&amp;state={{oauth.state}}&amp;response_type=code&amp;scope=openid&amp;redirect_uri={{oauth.redirectURI}}&amp;prompt=create">Sign up</a>
              </template>
              <div slot="viewport"></div>
            </oauth-link>
          </template>
          <div slot="viewport"></div>
        </app-router>
      </nav>
    </div>
  </header>

  <div class="devbar">
    <div class="wrap">
      Development build — <a href="#/dashboard">sign in</a> to see your appointments, or
      <a href="#/clinician">join as a practitioner</a>.
    </div>
  </div>

  <main>
  <!-- /clinician renders either the join pitch or the dashboard depending on auth
       state, and has no no-auth-redirect (it cannot redirect to itself). app-router
       re-runs renderCurrentPage on authStateChange but skips the render when the
       path is unchanged, so logging out while on that page left the old content in
       place. force-render-paths clears lastPageState for it so the branch re-evaluates. -->
  <app-router default-page="/" auto-reset-window-scroll force-render-paths="/clinician,/dashboard">

    <!-- ============================ HOME ============================ -->
    <template slot="page" route-path="/">
      <div class="wrap">
        <div class="hero">
          <h1>Online consultations with qualified natural therapists</h1>
          <p>Search practitioners by what you need help with, where they are, and when
             they are actually free — then book and meet online.</p>
          <div class="btn-row" style="margin-top:20px">
            <a class="btn" href="#/clinician">Join as a practitioner</a>
            <a class="btn sec" href="#/browse">Browse practitioners</a>
          </div>
        </div>

        <div class="card">
          <h2>Recently listed</h2>
          <div class="sub">Practitioners currently listed.</div>
          <collection-viewer
            collection-type="Clinician"
            collection-fields="displayName,professionalTitle,city,region,priceAmount,photo"
            collection-view="searchView"
            collection-view-params="listingStatus=listed,query=,sortBy=displayName"
            collection-view-primary-fields="listingStatus"
            collection-page-size="5"
          >
            <template slot="item">
              <div class="row">
                <div class="avatar sm"
                  style="background-image:{{Clinician.photo ? 'url(\'' + Clinician.photo + '\')' : 'none'}}"></div>
                <div class="grow">
                  <div class="t"><a href="#/p/{{Clinician.id}}">{{Clinician.displayName}}</a></div>
                  <div class="d">{{Clinician.professionalTitle}} · {{Clinician.city}}</div>
                </div>
                <div class="small muted">${{Clinician.priceAmount / 100}}</div>
              </div>
            </template>
            <template slot="no-item">
              <div class="empty">No clinicians are listed yet. A profile appears here once it is approved.</div>
            </template>
            <template slot="loader"><div class="spin">Loading…</div></template>
            <template slot="error"><div class="err">Could not load clinicians: {{$Clinician.error.message}}</div></template>
            <div slot="viewport"></div>
          </collection-viewer>
        </div>
      </div>
    </template>

    <!-- ============================ BROWSE ============================ -->
    <template slot="page" route-path="/browse">
      <div class="wrap">
        <h1>Practitioners</h1>
        <p class="muted">Patient-facing search arrives with the patient flow. This page previews
           the same <code>searchView</code> the search will use. Only practitioners an admin has
           marked as listed appear here — flipping that status is all it takes.</p>

        <div class="card">
          <div class="toolbar">
            <label class="f" style="margin:0"><span class="lab">Where</span>
              <input-provider
                class="cat-level1"
                name="region"
                type="select"
                options="Everywhere="
                value=""
                skip-init-change
                consumers=".search-combiner"
              ></input-provider></label>
            <label class="f" style="margin:0"><span class="lab">What they treat</span>
              <input-provider
                class="cat-level2"
                name="specialty"
                type="select"
                options="All specialties="
                value=""
                skip-init-change
                consumers=".search-combiner"
              ></input-provider></label>
          </div>

          <div class="toolbar">
            <label class="f" style="margin:0"><span class="lab">Available on</span>
              <input-provider
                name="day"
                type="select"
                options="Any day=,Monday=1,Tuesday=2,Wednesday=3,Thursday=4,Friday=5,Saturday=6,Sunday=0"
                value=""
                skip-init-change
                consumers=".search-combiner"
              ></input-provider></label>
            <label class="f" style="margin:0"><span class="lab">Time of day</span>
              <input-provider
                name="band"
                type="select"
                options="Any time=,Morning (6am-12pm)=morning,Afternoon (12-5pm)=afternoon,Evening (5-10pm)=evening"
                value=""
                skip-init-change
                consumers=".search-combiner"
              ></input-provider></label>
          </div>
          <div class="sub">Days and times are in your timezone ({{viewerTimeZone()}}).</div>

          <div class="toolbar">
            <label class="f" style="margin:0;flex:1"><span class="lab">Search</span>
              <!-- Emits a ready-made query fragment, or an empty string when blank so
                   it drops out of the AND. ~OR1~ binds tighter than the outer ~AND~
                   (higher number = higher priority), so this reads as
                   "... AND (name OR title OR city)". Commas are stripped because
                   collection-view-params is itself comma separated. -->
              <input-provider
                name="text"
                type="text"
                placeholder="Name, title or city"
                value=""
                skip-init-change
                debounce-delay="400"
                consumers=".search-combiner"
                provider-template="{{(function(t){return t ? 'displayName contains (?i)' + t + ' ~OR1~ professionalTitle contains (?i)' + t + ' ~OR1~ city contains (?i)' + t : ''})(value.split(',').join(' ').trim())}}"
              ></input-provider></label>
            <label class="f" style="margin:0;flex:0 1 200px"><span class="lab">Sort by</span>
              <!-- The direction rides on the value: transformOrderByField accepts a
                   trailing " desc" on the param it is bound to. -->
              <input-provider
                name="sort"
                type="select"
                options="Name=displayName,From Lowest Fee=priceAmount,From Highest Fee=priceAmount desc"
                value="displayName"
                skip-init-change
                consumers=".search-combiner"
              ></input-provider></label>
          </div>

          <input-combiner
            class="search-combiner"
            consumers=".search-results:collection-view-params"
            provider-template="listingStatus=listed,query={{[value.region, value.specialty, value.text, searchHoursQuery(value.day, value.band)].filter(Boolean).join(' ~AND~ ')}},sortBy={{value.sort || 'displayName'}}"
          ></input-combiner>

            <collection-reducer
              collection-type="Category"
              collection-fields="label,query,position"
              collection-view="levelView"
              collection-view-params="level=1"
              collection-view-primary-fields="level"
              collection-page-size="100"
            >
              <template slot="item">
                <input-provider
                  type="text"
                  style="display:none"
                  value="{{Category.map(c => c.label + '=' + c.query).join(',')}}"
                  consumers=".cat-level1:options"
                  provider-template="Everywhere=,{{value}}"
                ></input-provider>
              </template>
              <div slot="viewport"></div>
            </collection-reducer>

            <collection-reducer
              collection-type="Category"
              collection-fields="label,query,position"
              collection-view="levelView"
              collection-view-params="level=2"
              collection-view-primary-fields="level"
              collection-page-size="100"
            >
              <template slot="item">
                <input-provider
                  type="text"
                  style="display:none"
                  value="{{Category.map(c => c.label + '=' + c.query).join(',')}}"
                  consumers=".cat-level2:options"
                  provider-template="All specialties=,{{value}}"
                ></input-provider>
              </template>
              <div slot="viewport"></div>
            </collection-reducer>

          <collection-viewer
            class="search-results"
            collection-type="Clinician"
            collection-fields="displayName,professionalTitle,city,priceAmount,consultationMinutes,photo,utcHours"
            collection-view="searchView"
            collection-view-params="listingStatus=listed,query=,sortBy=displayName"
            collection-view-primary-fields="listingStatus"
            collection-page-size="10"
            auto-reset-page-offset
          >
            <template slot="item">
              <div class="row">
                <div class="avatar sm"
                  style="background-image:{{Clinician.photo ? 'url(\'' + Clinician.photo + '\')' : 'none'}}"></div>
                <div class="grow">
                  <div class="t"><a href="#/p/{{Clinician.id}}">{{Clinician.displayName}}</a></div>
                  <div class="d">{{Clinician.professionalTitle}} · {{Clinician.city}}</div>
                  <div class="d small muted">{{localDaysLabel(Clinician.utcHours)}}</div>
                </div>
                <div class="small muted">${{Clinician.priceAmount / 100}} / {{Clinician.consultationMinutes}} min</div>
              </div>
            </template>
            <template slot="no-item">
              <div class="empty">No listed practitioners match that key yet.<br>
                <span class="small">Only clinicians with <code>listingStatus = listed</code> carry search keys.</span></div>
            </template>
            <template slot="loader"><div class="spin">Searching…</div></template>
            <template slot="error"><div class="err">{{$Clinician.error.message}}</div></template>
            <div slot="viewport"></div>
            <input slot="previous-page" class="btn sec pager-btn" type="button" value="Previous">
            <div slot="page-number" class="pager-num"></div>
            <input slot="next-page" class="btn sec pager-btn" type="button" value="Next">
          </collection-viewer>
        </div>
      </div>
    </template>

    <!-- ============================ PUBLIC PROFILE ============================ -->
    <template slot="page" route-path="/p/:clinicianId">
      <div class="wrap">
        <model-viewer
          model-type="Clinician"
          model-id="{{clinicianId}}"
          model-fields="displayName,professionalTitle,bio,city,region,country,timezone,priceAmount,consultationMinutes,languages,topics,ratingAverage,ratingCount,listingStatus,photo"
        >
          <template slot="item">
            <div class="profile-head">
              <!-- The photo field holds a data URI, so it renders straight from this viewer. -->
              <img class="avatar" width="96" height="96" src="{{fallback(Clinician.photo, '')}}" alt="">
              <div>
                <h1 style="margin:0">{{Clinician.displayName}}</h1>
                <p class="muted" style="margin:4px 0 0">{{Clinician.professionalTitle}} · {{Clinician.city}}, {{Clinician.region}}</p>
              </div>
            </div>
            <div class="card">
              <h2>About</h2>
              <p>{{Clinician.bio}}</p>
              <table class="plain">
                <tr><th>Consultation</th><td>{{Clinician.consultationMinutes}} minutes, online</td></tr>
                <tr><th>Fee</th><td>${{Clinician.priceAmount / 100}} AUD</td></tr>
                <tr><th>Languages</th><td>{{Clinician.languages}}</td></tr>
                <tr><th>Focus areas</th><td>{{Clinician.topics}}</td></tr>
                <tr><th>Timezone</th><td>{{Clinician.timezone}}</td></tr>
              </table>
            </div>
            <div class="card">
              <h2>Qualifications</h2>
              <div class="sub">Only approved documents are shown publicly.</div>
              <collection-viewer
                collection-type="Document"
                type-alias="Doc"
                collection-fields="type,institution,documentName,yearAwarded,reviewStatus"
                collection-view="clinicianView"
                collection-view-params="clinicianId={{Clinician.id}}"
                collection-view-primary-fields="clinicianId"
                collection-page-size="20"
              >
                <template slot="item">
                  <if-group show-content="{{Doc.reviewStatus === 'approved'}}">
                    <template slot="content">
                      <div class="row">
                        <div class="grow">
                          <div class="t">{{Doc.documentName}}</div>
                          <div class="d">{{Doc.institution}} · {{Doc.yearAwarded}}</div>
                          <!-- Documents are world-readable; we only surface the link once a
                               reviewer has approved the document. -->
                          <div class="d small"><a href="https://sid8016.saasufy.com/files/Document/{{Doc.id}}/document"
                            target="_blank" rel="noopener">View certificate</a></div>
                        </div>
                        <span class="pill ok">verified</span>
                      </div>
                    </template>
                    <div slot="viewport"></div>
                  </if-group>
                </template>
                <template slot="no-item"><div class="empty">No qualifications listed.</div></template>
                <template slot="error"><div class="err">{{$Doc.error.message}}</div></template>
                <div slot="viewport"></div>
              </collection-viewer>
            </div>
            <div class="card">
              <h2>Book a consultation</h2>
              <p class="muted small">Pick from the times {{Clinician.displayName}} has open over
                 the next 60 days, shown in your own timezone.</p>
              <a class="btn" href="#/book/{{Clinician.id}}">Choose a time</a>
            </div>
          </template>
          <div slot="viewport"></div>
        </model-viewer>
      </div>
    </template>

    <!-- ============================ BOOK A TIME ============================ -->
     <template slot="page" route-path="/book/:clinicianId" auto-reset-window-scroll>
      <div class="wrap booking-page">
        <model-viewer
          model-type="Clinician"
          model-id="{{clinicianId}}"
          model-fields="displayName,professionalTitle,timezone,priceAmount,consultationMinutes"
        >
          <template slot="item">
            <p class="small"><a href="#/p/{{Clinician.id}}">&larr; Back to the profile</a></p>
            <h1>Book with {{Clinician.displayName}}</h1>
            <p class="muted">{{Clinician.professionalTitle}} ·
               {{Clinician.consultationMinutes}} minutes online ·
               ${{Clinician.priceAmount / 100}} AUD</p>

            <div class="card">
              <h2>Choose a time</h2>
              <div class="sub">Times are shown in your timezone, {{viewerTimeZone()}} —
                {{Clinician.displayName}} works in {{Clinician.timezone}}. Bookings open for
                the next 60 days, from two hours' time.</div>

              <!-- The weekly pattern; the times themselves are computed from it in the
                   browser. No `no-item` on either reducer: a clinician with no hours, or
                   an empty week, must still render the arrows, so the item template draws
                   those cases itself. -->
              <collection-reducer
                class="avail-source"
                collection-type="Availability"
                type-alias="Avail"
                collection-fields="kind,active,startMinuteOfWeek,endMinuteOfWeek,date,startMinuteOfDay,endMinuteOfDay,effectiveFrom,effectiveUntil"
                collection-view="clinicianView"
                collection-view-params="clinicianId={{Clinician.id}}"
                collection-view-primary-fields="clinicianId"
                collection-page-size="200"
                data-clinician-id="{{Clinician.id}}"
                data-name="{{Clinician.displayName}}"
                data-zone="{{Clinician.timezone}}"
                data-minutes="{{Clinician.consultationMinutes}}"
              >
                <template slot="item">{{{holdBlocks.call(this, Avail)}}}
                  <!-- Only the times already taken are stored, so this stays small. -->
                  <collection-reducer
                    class="slot-source"
                    collection-type="TimeSlot"
                    type-alias="Taken"
                    collection-fields="startAt,status"
                    collection-view="clinicianRangeView"
                    collection-view-params="{{slotWeekParams(Clinician.id, 0)}}"
                    collection-view-primary-fields="clinicianId"
                    collection-page-size="200"
                    data-clinician-id="{{Clinician.id}}"
                  >
                    <template slot="item">{{{slotCalendar.call(this, Taken)}}}</template>
                    <template slot="loader"><div class="spin">Loading available times…</div></template>
                    <template slot="error"><div class="err">{{$Taken.error.message}}</div></template>
                    <div slot="viewport"></div>
                  </collection-reducer>
                </template>
                <template slot="loader"><div class="spin">Loading available times…</div></template>
                <template slot="error"><div class="err">{{$Avail.error.message}}</div></template>
                <div slot="viewport"></div>
              </collection-reducer>
            </div>

            <!-- Outside the reducer: a slot update redraws the calendar, and what is
                 typed here has to survive that. -->
            <div class="card booking-request" hidden
              data-clinician-id="{{Clinician.id}}"
              data-name="{{Clinician.displayName}}"
            >
              <h2>Confirm this appointment</h2>
              <p class="chosen"></p>
              <p class="chosen-sub"></p>
              <!-- No email field. Keycloak collects and verifies the address on the way
                   to payment, and it is the one the invitation and the receipt use
                   (REQ-PAT-4); asking here as well only invites the two to disagree. -->
              <label class="f"><span class="lab">Your name</span>
                <input type="text" name="patientName" placeholder="Alex Moore">
                <span class="hint">{{Clinician.displayName}} sees this on the invitation.</span></label>
              <label class="f"><span class="lab">What would you like help with?</span>
                <textarea name="intakeReason" maxlength="500"
                  placeholder="A sentence or two — it goes in the invitation."></textarea>
                <span class="hint">Optional, up to 500 characters, and seen only by
                  {{Clinician.displayName}}.</span></label>
              <div class="btn-row">
                <button type="button" class="btn request-btn">Request this time</button>
              </div>
              <div class="request-msg"></div>

              <!-- Revealed by the button rather than shown up front: the account is the
                   last thing asked for, after the time and the reason are settled
                   (REQ-PAT-1, REQ-PAT-3). The choice is held in sessionStorage, so the
                   Keycloak round trip comes back to the payment step with it intact. -->
              <div class="booking-auth" hidden>
                <h3 style="margin:18px 0 2px">One last step</h3>
                <p class="muted small">We need an account to take the payment and to send
                  you the meeting link. Your email address comes from the sign-up — we do
                  not ask for it twice.</p>
                <div class="btn-row">
                  <oauth-link
                    provider="keycloak:dev"
                    client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
                    redirect-uri="http://localhost:8100/index.html"
                    grant-type="authorization_code"
                  >
                    <template slot="item">
                      <a class="btn" href="https://auth.saasufy.com/realms/tenant/protocol/openid-connect/auth?client_id={{oauth.clientId}}&amp;state={{oauth.state}}&amp;response_type=code&amp;scope=openid&amp;redirect_uri={{oauth.redirectURI}}&amp;prompt=create">
                        Create an account
                      </a>
                    </template>
                    <div slot="viewport"></div>
                  </oauth-link>
                  <oauth-link
                    provider="keycloak:dev"
                    client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
                    redirect-uri="http://localhost:8100/index.html"
                    grant-type="authorization_code"
                  >
                    <template slot="item">
                      <a class="btn sec" href="https://auth.saasufy.com/realms/tenant/protocol/openid-connect/auth?client_id={{oauth.clientId}}&amp;state={{oauth.state}}&amp;response_type=code&amp;scope=openid&amp;redirect_uri={{oauth.redirectURI}}">
                        I already have one
                      </a>
                    </template>
                    <div slot="viewport"></div>
                  </oauth-link>
                </div>
              </div>
            </div>
          </template>
          <template slot="no-item"><div class="card"><p class="muted">No such practitioner.</p></div></template>
          <template slot="error"><div class="err">{{$Clinician.error.message}}</div></template>
          <div slot="viewport"></div>
        </model-viewer>
      </div>
    </template>

    <!-- ===================== PAYMENT AND CONFIRMATION =====================
         Both pages render from the held booking, which lives in sessionStorage, but
         wrap it in a model-viewer on the clinician: the practitioner's name, title,
         price and timezone are read live rather than trusted from the hold.

         /booking/resume is the landing spot after the Keycloak round trip, which
         cannot carry the clinician id in a fixed success URL. A script near the top
         of this file rewrites the hash from the hold; this page only covers the
         moment in between. -->
    <template slot="page" route-path="/booking/resume">
      <div class="wrap"><div class="card"><div class="spin">Picking up where you left off…</div></div></div>
    </template>

    <template slot="page" route-path="/booking/payment/:clinicianId" no-auth-redirect="/browse" auto-reset-window-scroll>
      <div class="wrap">
        <h1>Complete your payment</h1>
        <p class="muted">We take the payment now and hold it until the consultation has
           taken place.</p>
        <model-viewer
          model-type="Clinician"
          model-id="{{clinicianId}}"
          model-fields="accountId,displayName,professionalTitle,timezone,priceAmount,consultationMinutes"
          type-alias="C"
        >
          <template slot="item">{{{paymentPrompt(C)}}}</template>
          <template slot="no-item"><div class="card"><p class="muted">No such practitioner.</p></div></template>
          <template slot="loader"><div class="card"><div class="spin">Loading…</div></div></template>
          <template slot="error"><div class="err">{{$C.error.message}}</div></template>
          <div slot="viewport"></div>
        </model-viewer>
      </div>
    </template>

    <!-- Where Pin's redirect will land once the checkout of REQ-BOOK-0 exists. The
         Appointment row is written here, by the patient's own browser, because the
         worker which should own it (REQ-ARCH-12) is not built yet. -->
    <template slot="page" route-path="/booking/confirmed/:clinicianId" no-auth-redirect="/browse" auto-reset-window-scroll>
      <div class="wrap">
        <model-viewer
          model-type="Clinician"
          model-id="{{clinicianId}}"
          model-fields="accountId,displayName,professionalTitle,timezone,priceAmount,consultationMinutes"
          type-alias="C"
        >
          <template slot="item">{{{bookingConfirmation(C)}}}</template>
          <template slot="no-item"><div class="card"><p class="muted">No such practitioner.</p></div></template>
          <template slot="loader"><div class="card"><div class="spin">Loading…</div></div></template>
          <template slot="error"><div class="err">{{$C.error.message}}</div></template>
          <div slot="viewport"></div>
        </model-viewer>
      </div>
    </template>

    <!-- ============================== DASHBOARD ==============================
         One route, two dashboards. Which one you get is decided by whether a
         Clinician record exists for the signed-in account — that is the whole of
         what makes an account a practitioner (REQ-AUTH-4), so the role test is the
         collection-viewer's own item/no-item branch and nothing is stored on the
         account to be kept in step. The two share only what is genuinely the same
         for both: your own details, and who you are signed in as. -->
    <template slot="page" route-path="/dashboard" auto-reset-window-scroll>
      <div class="wrap">

        <if-group show-content="{{!socket.authToken}}">
          <template slot="content">
            <h1>Your dashboard</h1>
            <div class="card">
              <h2>Sign in to continue</h2>
              <p class="muted">Patients find their appointments here. Practitioners manage
                 their profile, their hours and their bookings.</p>
              <div class="btn-row">
                <oauth-link
                  provider="keycloak:dev"
                  client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
                  redirect-uri="http://localhost:8100/index.html"
                  grant-type="authorization_code"
                >
                  <template slot="item">
                    <a class="btn" href="https://auth.saasufy.com/realms/tenant/protocol/openid-connect/auth?client_id={{oauth.clientId}}&amp;state={{oauth.state}}&amp;response_type=code&amp;scope=openid&amp;redirect_uri={{oauth.redirectURI}}">Log in</a>
                  </template>
                  <div slot="viewport"></div>
                </oauth-link>
                <oauth-link
                  provider="keycloak:dev"
                  client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
                  redirect-uri="http://localhost:8100/index.html"
                  grant-type="authorization_code"
                >
                  <template slot="item">
                    <a class="btn sec" href="https://auth.saasufy.com/realms/tenant/protocol/openid-connect/auth?client_id={{oauth.clientId}}&amp;state={{oauth.state}}&amp;response_type=code&amp;scope=openid&amp;redirect_uri={{oauth.redirectURI}}&amp;prompt=create">Sign up</a>
                  </template>
                  <div slot="viewport"></div>
                </oauth-link>
              </div>

                        <li>

                    <!-- The patient has committed by the time a row appears here, so

                    <div class="card">
                      <div class="sechead"><h2>Your appointments</h2></div>

                          <div class="d">${{Appt.amount / 100}} {{Appt.currency}}</div>
                        </div>
                      </div>
                    </template>
                    <template slot="no-item"><div class="empty">Nothing booked yet.</div></template>
                    <template slot="loader"><div class="spin">Loading…</div></template>
                    <template slot="error"><div class="err">{{$Appt.error.message}}</div></template>
                    <div slot="viewport"></div>

                <div class="card">
                  <div class="sechead"><h2>Past</h2></div>

                    collection-type="Appointment"

                    collection-fields="startAt,endAt,status,clinicianId,declineReason,amount,currency"
                    collection-view="patientView"
                    collection-view-params="{{appointmentParams(socket.authToken ? socket.authToken.accountId : '', 'past')}}"
                    collection-view-primary-fields="accountId"

                            model-type="Clinician" model-id="{{Appt.clinicianId}}"

              search results. Expect the process to take a few days, mostly waiting on document review.</p>

            <div class="card">
              <h2>How it works</h2>
              <ol class="steps">
                <li><div><div class="t">Create your account</div>
                  <div class="d muted">Email sign-up and verification, handled by our identity provider.</div></div></li>
                <li><div><div class="t">Complete your profile</div>
                  <div class="d muted">Your name, focus areas, location, fee and a biography patients will read.</div></div></li>
                <li><div><div class="t">Submit your documents</div>
                  <div class="d muted">Degrees, registrations and certifications, and the certificate for each.</div></div></li>
                <li><div><div class="t">Add your payout details</div>
                  <div class="d muted">Where we send your share after each completed consultation.</div></div></li>
                <li><div><div class="t">Publish your availability</div>
                  <div class="d muted">A weekly pattern plus any days off. Patients book against it.</div></div></li>

            <div class="card">

                  client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
                  redirect-uri="http://localhost:8100/index.html"
                  grant-type="authorization_code"

                      Sign up with email

                  </template>
                  <div slot="viewport"></div>
                </oauth-link>

                <oauth-link
                  provider="keycloak:dev"
                  client-id="saasufy-0eabf8a1-d86a-473e-a20d-4ca9ecfb8069-dev"
                  redirect-uri="http://localhost:8100/index.html"
                  grant-type="authorization_code"
                >
                  <template slot="item">

<template slot="no-item">

                  <collection-adder-form
                    collection-type="Clinician"
                    model-values="accountId={{socket.authToken ? socket.authToken.accountId : ''}},listingStatus=draft,priceCurrency=AUD"
                    computable-model-values
                    success-message="Profile created."
                    trim-spaces
                    show-field-errors
                  >
                    <div slot="message"></div>
                    <label class="f"><span class="lab">Display name</span>
                      <input type="text" name="displayName" placeholder="Dr Jane Smith"></label>
                    <label class="f"><span class="lab">Professional title</span>
                      <input type="text" name="professionalTitle" placeholder="Naturopath, BHSc"></label>
                    <input class="btn" type="submit" value="Create profile">
                  </collection-adder-form>
                </div>
                      </template>
              <template slot="loader"><div class="spin">Loading your profile…</div></template>
              <template slot="error"><div class="err">Could not load your profile: {{$Clinician.error.message}}</div></template>
              <div slot="viewport"></div>
            </collection-viewer>
          </template>
          <div slot="viewport"></div>
        </if-group>
      </div>
    </template>

    <!-- ============================ PROFILE ============================ -->
    <template slot="page" route-path="/clinician/profile" no-auth-redirect="/clinician" auto-reset-window-scroll>
      <div class="wrap">
        <h1>Your profile</h1>
        <p class="muted">Changes save as you type. This is what patients read before booking.</p>

        <collection-viewer
          collection-type="Clinician"
          collection-fields="accountId"
          collection-view="accountView"
          collection-view-params="accountId={{socket.authToken ? socket.authToken.accountId : ''}}"
          collection-view-primary-fields="accountId"
          collection-page-size="1"
        >
          <template slot="item">
            <div class="card">
              <h2>Basics</h2>
              <div class="sub">Shown at the top of your public profile.</div>
              <div class="grid2">
                <label class="f"><span class="lab">Display name</span>
                  <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="displayName" show-error-message></model-input></label>
                <label class="f"><span class="lab">Professional title</span>
                  <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="professionalTitle" placeholder="Naturopath, BHSc" show-error-message></model-input></label>
              </div>
              <label class="f"><span class="lab">Biography</span>
                <model-input type="textarea" model-type="Clinician" model-id="{{Clinician.id}}"
                  model-field="bio" height="170" show-error-message></model-input>
                <span class="hint">At least 200 characters. Explain who you help and how you work.</span></label>
            </div>

            <div class="card">
              <h2>Photo</h2>
              <div class="sub">Shown on your public profile.</div>
              <div class="avatar-row">
                <!-- Bound to the photo field itself rather than to the /files URL: the field
                     holds a data URI, so when it changes this model-viewer re-renders and the
                     new image appears immediately. A static file URL would stay cached. -->
                <model-viewer
                  model-type="Clinician"
                  model-id="{{Clinician.id}}"
                  model-fields="photo"
                  type-alias="Pic"
                >
                  <template slot="item">
                    <switch-group show-cases="has={{!!Pic.photo}},none={{!Pic.photo}}">
                      <template slot="content" name="has">
                        <div class="avatar" style="background-image:url('{{Pic.photo}}')"></div>
                      </template>
                      <template slot="content" name="none">
                        <div class="avatar"></div>
                      </template>
                      <div slot="viewport"></div>
                    </switch-group>
                  </template>
                  <div slot="viewport"></div>
                </model-viewer>
                <label class="f" style="flex:1;min-width:220px">
                  <span class="lab">Upload a new photo</span>
                  <model-input type="file" accept="image/png,image/jpeg,image/webp"
                    model-type="Clinician" model-id="{{Clinician.id}}" model-field="photo"
                    enable-rebound show-error-message></model-input>
                  <span class="hint">Stored in Saasufy as a base64 blob. The field is capped at
                    200,000 characters (roughly 150&nbsp;KB of image); anything larger is
                    rejected and the reason appears below. The preview updates as soon as the upload lands.</span>
                </label>
              </div>
            </div>

            <div class="card">
              <h2>Focus areas</h2>
              <div class="sub">What patients search by. Up to 8 topics.</div>
              <label class="f"><span class="lab">Your topics</span>
                <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                  model-field="topics" placeholder="naturopathy,nutrition" show-error-message></model-input>
                <span class="hint">Comma-separated slugs from the list below. Saasufy stores
                  multi-value fields as comma-separated strings.</span></label>

              <!-- Only categories patients can filter on are selectable here. -->
              <h3 style="margin-top:18px">Available topics</h3>
              <div class="grid2">
                <div>
                  <div class="small muted" style="margin-bottom:6px">Specialisations</div>
                  <collection-viewer
                    collection-type="Category" type-alias="Cat"
                    collection-fields="label,slug,kind,position"
                    collection-view="kindView" collection-view-params="kind=specialisation"
                    collection-view-primary-fields="kind" collection-page-size="30"
                  >
                    <template slot="item"><div class="small"><code>{{Cat.slug}}</code> — {{Cat.label}}</div></template>
                    <template slot="no-item"><div class="empty small">None seeded.</div></template>
                    <div slot="viewport"></div>
                  </collection-viewer>
                </div>
                <div>
                  <div class="small muted" style="margin-bottom:6px">Ailments</div>
                  <collection-viewer
                    collection-type="Category" type-alias="Cat"
                    collection-fields="label,slug,kind,position"
                    collection-view="kindView" collection-view-params="kind=ailment"
                    collection-view-primary-fields="kind" collection-page-size="30"
                  >
                    <template slot="item"><div class="small"><code>{{Cat.slug}}</code> — {{Cat.label}}</div></template>
                    <template slot="no-item"><div class="empty small">None seeded.</div></template>
                    <div slot="viewport"></div>
                  </collection-viewer>
                </div>
              </div>
            </div>

            <div class="card">
              <h2>Location &amp; consultation</h2>
              <div class="sub">Consultations are online; location sets your timezone and search region.</div>
              <div class="grid2">
                <label class="f"><span class="lab">Country</span>
                  <model-input type="select" options="au,nz" model-type="Clinician"
                    model-id="{{Clinician.id}}" model-field="country" show-error-message></model-input></label>
                <label class="f"><span class="lab">State / region</span>
                  <model-input type="select" options="nsw,vic,qld,wa,sa,tas,act,nt" model-type="Clinician"
                    model-id="{{Clinician.id}}" model-field="region" show-error-message></model-input></label>
                <label class="f"><span class="lab">City</span>
                  <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="city" show-error-message></model-input></label>
                <label class="f"><span class="lab">Timezone</span>
                  <model-input type="select"
                    options="Australia/Sydney,Australia/Melbourne,Australia/Brisbane,Australia/Adelaide,Australia/Perth,Australia/Hobart,Australia/Darwin,Pacific/Auckland"
                    model-type="Clinician" model-id="{{Clinician.id}}" model-field="timezone" show-error-message></model-input></label>
                <label class="f"><span class="lab">Consultation length</span>
                  <model-input type="select"
                    options="30 minutes:number=30,45 minutes:number=45,60 minutes:number=60"
                    model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="consultationMinutes" show-error-message></model-input>
                  <span class="hint">Options carry an explicit <code>:number</code> type because
                    <code>consultationMinutes</code> is a number field.</span></label>
                <label class="f"><span class="lab">Fee (cents, AUD)</span>
                  <model-input type="number" model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="priceAmount" show-error-message></model-input>
                  <span class="hint">Stored as integer cents — 13500 is $135.00.</span></label>
                <label class="f"><span class="lab">Languages</span>
                  <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="languages" placeholder="English,Mandarin" show-error-message></model-input></label>
                <label class="f"><span class="lab">Contact email (private)</span>
                  <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                    model-field="contactEmail" show-error-message></model-input>
                  <span class="hint">Never shown publicly.</span></label>
              </div>
            </div>

            <div class="card">
              <h2>Listing</h2>
              <div class="sub">Set by a reviewer once your profile and documents check out.</div>
              <table class="plain">
                <tr><th>Listing status</th><td><model-text model-type="Clinician" model-id="{{Clinician.id}}" model-field="listingStatus"></model-text></td></tr>
                <tr><th>Reviewer note</th><td><model-text model-type="Clinician" model-id="{{Clinician.id}}" model-field="listingNote" default-value="&#8212;"></model-text></td></tr>
                <tr><th>Visible in search</th><td>Only while listing status is <code>listed</code>.</td></tr>
              </table>
            </div>
          </template>
          <template slot="no-item"><div class="card"><p class="muted">No profile yet — <a href="#/clinician">create one</a>.</p></div></template>
          <template slot="loader"><div class="spin">Loading…</div></template>
          <template slot="error"><div class="err">{{$Clinician.error.message}}</div></template>
          <div slot="viewport"></div>
        </collection-viewer>
      </div>
    </template>

    <!-- ============================= DOCUMENTS ============================= -->
    <template slot="page" route-path="/clinician/documents" no-auth-redirect="/clinician">
      <div class="wrap">
        <h1>Your documents</h1>
        <p class="muted">At least one approved qualification is required before you can be listed.
           Supporting documents are never shown publicly.</p>

        <div class="card">
          <h2>Submitted</h2>
          <collection-viewer
            collection-type="Document"
            type-alias="Doc"
            collection-fields="type,institution,documentName,yearAwarded,reviewStatus,reviewNote"
            collection-view="accountView"
            collection-view-params="accountId={{socket.authToken ? socket.authToken.accountId : ''}}"
            collection-view-primary-fields="accountId"
            collection-page-size="20"
          >
            <template slot="item">
              <div class="row">
                <div class="grow">
                  <div class="t">{{Doc.documentName}}</div>
                  <div class="d">{{Doc.institution}} · {{Doc.yearAwarded}} · {{Doc.type}}</div>
                  <if-group show-content="{{!!Doc.reviewNote}}">
                    <template slot="content"><div class="d" style="margin-top:4px">Reviewer note: {{Doc.reviewNote}}</div></template>
                    <div slot="viewport"></div>
                  </if-group>
                  <if-group show-content="{{Doc.reviewStatus === 'approved'}}">
                    <template slot="content"><div class="d small"><a href="https://sid8016.saasufy.com/files/Document/{{Doc.id}}/document"
                      target="_blank" rel="noopener">View certificate</a></div></template>
                    <div slot="viewport"></div>
                  </if-group>
                </div>
                <switch-group show-cases="a={{Doc.reviewStatus === 'approved'}},p={{Doc.reviewStatus === 'pending'}},r={{Doc.reviewStatus === 'rejected'}}">
                  <template slot="content" name="a"><span class="pill ok">approved</span></template>
                  <template slot="content" name="p"><span class="pill pend">pending</span></template>
                  <template slot="content" name="r"><span class="pill no">rejected</span></template>
                  <div slot="viewport"></div>
                </switch-group>
                <collection-deleter model-id="{{Doc.id}}"
                  confirm-message="Remove this document? This cannot be undone."
                  onclick="confirmDeleteItem()">&#x2715;</collection-deleter>
              </div>
            </template>
            <template slot="no-item"><div class="empty">Nothing submitted yet.</div></template>
            <template slot="loader"><div class="spin">Loading…</div></template>
            <template slot="error"><div class="err">{{$Doc.error.message}}</div></template>
            <div slot="viewport"></div>
            <confirm-modal slot="modal" heading="Remove document" message="" confirm-button-label="Remove" cancel-button-label="Cancel" auto-focus="cancel"></confirm-modal>
          </collection-viewer>
        </div>

        <collection-viewer
          collection-type="Clinician"
          collection-fields="accountId"
          collection-view="accountView"
          collection-view-params="accountId={{socket.authToken ? socket.authToken.accountId : ''}}"
          collection-view-primary-fields="accountId"
          collection-page-size="1"
        >
          <template slot="item">
            <div class="card">
              <h2>Add a document</h2>
              <div class="sub">Submitted documents go to our review queue.</div>
              <collection-adder-form
                class="notice"
                collection-type="Document"
                model-values="accountId={{socket.authToken ? socket.authToken.accountId : ''}},clinicianId={{Clinician.id}},reviewStatus=pending"
                computable-model-values
                success-message="Submitted for review — it is now in your list above, marked pending. You can add as many documents as you need."
                trim-spaces
                show-field-errors
              >
                <div slot="message"></div>
                <div class="grid2">
                  <label class="f"><span class="lab">Type</span>
                    <select name="type">
                      <option value="degree">Degree</option>
                      <option value="diploma">Diploma</option>
                      <option value="certification">Certification</option>
                      <option value="registration">Professional registration</option>
                      <option value="licence">Licence</option>
                      <option value="insurance">Insurance certificate</option>
                    </select></label>
                  <label class="f"><span class="lab">Year awarded</span>
                    <input type="number" name="yearAwarded" output-type="number" placeholder="2014"></label>
                  <label class="f"><span class="lab">Institution / body</span>
                    <input type="text" name="institution" placeholder="Southern Cross University"></label>
                  <label class="f"><span class="lab">Document name</span>
                    <input type="text" name="documentName" placeholder="Bachelor of Health Science"></label>
                  <label class="f"><span class="lab">Registration number (private)</span>
                    <input type="text" name="registrationNumber" placeholder="Optional"></label>
                </div>
                <label class="f"><span class="lab">Supporting document</span>
                  <input type="file" name="document" accept=".pdf,.png,.jpg,.jpeg">
                  <span class="hint">PDF or image. Stored privately and only seen by our review team.</span></label>
                <input class="btn" type="submit" value="Submit for review">
              </collection-adder-form>
            </div>
          </template>
          <template slot="no-item"><div class="card"><p class="muted">No profile yet — <a href="#/clinician">create one</a>.</p></div></template>
          <template slot="error"><div class="err">{{$Clinician.error.message}}</div></template>
          <div slot="viewport"></div>
        </collection-viewer>
      </div>
    </template>

    <!-- ============================ AVAILABILITY ============================ -->
    <template slot="page" route-path="/clinician/availability" no-auth-redirect="/clinician">
      <div class="wrap">
        <h1>Your availability</h1>
        <p class="muted">Set the hours you normally work, then block out days you are away.
           We turn this into bookable appointment times on a rolling 60-day window.</p>

        <div class="card">
          <h2>Current schedule</h2>
          <collection-viewer
            collection-type="Availability"
            collection-fields="kind,startMinuteOfWeek,endMinuteOfWeek,date,startMinuteOfDay,endMinuteOfDay,active"
            collection-view="accountView"
            collection-view-params="accountId={{socket.authToken ? socket.authToken.accountId : ''}}"
            collection-view-primary-fields="accountId"
            collection-page-size="50"
          >
            <template slot="item">
              <div class="row avail">
                <div class="grow">
                  <switch-group show-cases="w={{Availability.kind === 'weekly'}},o={{Availability.kind === 'dayOff'}},e={{Availability.kind === 'extra'}}">
                    <template slot="content" name="w">
                      <div class="t">{{weekdayName(Availability.startMinuteOfWeek)}}</div>
                      <div class="d">Every week</div>
                    </template>
                    <template slot="content" name="o">
                      <div class="t">Day off</div>
                      <div class="d">{{date(Availability.date)}}</div>
                    </template>
                    <template slot="content" name="e">
                      <div class="t">Extra hours</div>
                      <div class="d">{{date(Availability.date)}}</div>
                    </template>
                    <div slot="viewport"></div>
                  </switch-group>
                </div>
                <div class="small muted">{{availabilityRange(Availability)}}</div>
                <collection-deleter model-id="{{Availability.id}}"
                  confirm-message="Remove this availability entry?"
                  onclick="confirmDeleteItem()">&#x2715;</collection-deleter>
              </div>
            </template>
            <template slot="no-item"><div class="empty">Nothing set yet. Add your weekly hours below.</div></template>
            <template slot="loader"><div class="spin">Loading…</div></template>
            <template slot="error"><div class="err">Could not load availability: {{$Availability.error.message}}</div></template>
            <div slot="viewport"></div>
            <confirm-modal slot="modal" heading="Remove availability" message="" confirm-button-label="Remove" cancel-button-label="Cancel" auto-focus="cancel"></confirm-modal>
          </collection-viewer>
        </div>

        <collection-viewer
          collection-type="Clinician"
          collection-fields="accountId,timezone"
          collection-view="accountView"
          collection-view-params="accountId={{socket.authToken ? socket.authToken.accountId : ''}}"
          collection-view-primary-fields="accountId"
          collection-page-size="1"
        >
          <template slot="item">
            <div class="note">
              Times are in your profile timezone
              (<model-text model-type="Clinician" model-id="{{Clinician.id}}" model-field="timezone"
                default-value="not set — this browser's timezone is used until you set one"></model-text>),
              stored as minutes from local Sunday midnight.
              Patients searching from elsewhere see them converted to their own timezone.
              An end at or before the start means the next day, so 8pm–2am is one block.
              Whole hours only for now; the clock helper handles any minute, so finer steps are
              just more options.
            </div>

            <div class="card">
              <h2>Add weekly hours</h2>
              <div class="sub">The hours you normally work on a given day.</div>
              <collection-adder-form
                class="weekly-hours notice"
                data-timezone="{{Clinician.timezone}}"
                collection-type="Availability"
                model-values="accountId={{socket.authToken ? socket.authToken.accountId : ''}},clinicianId={{Clinician.id}},kind=weekly,active:boolean=true"
                computable-model-values
                success-message="Added — it is now in your schedule above. You can add as many blocks as you need."
                show-field-errors
              >
                <div slot="message"></div>
                <!-- The hidden fields below are what gets stored; a change handler keeps them
                     in step with the selects. The selects hold their numbers in data-value
                     because collection-adder-form submits every control that has a value,
                     named or not, and an empty field name is rejected by the schema. -->
                <input type="hidden" name="startMinuteOfWeek" output-type="number" value="1980">
                <input type="hidden" name="endMinuteOfWeek" output-type="number" value="2460">
                <input type="hidden" name="utcHourKeys"
                  value="{{weeklyKeys(1, 540, 1020, Clinician.timezone)}}">
                <div class="grid2">
                  <label class="f"><span class="lab">Day</span>
                    <select data-role="day">
                      <option data-value="1" value="">Monday</option><option data-value="2" value="">Tuesday</option>
                      <option data-value="3" value="">Wednesday</option><option data-value="4" value="">Thursday</option>
                      <option data-value="5" value="">Friday</option><option data-value="6" value="">Saturday</option>
                      <option data-value="0" value="">Sunday</option>
                    </select></label>
                  <label class="f"><span class="lab">&nbsp;</span>
                    <input class="btn" type="submit" value="Add weekly hours"></label>
                  <label class="f"><span class="lab">Starts at</span>
                    <select data-role="start">
                      <option data-value="0" value="">12:00 am</option><option data-value="60" value="">1:00 am</option><option data-value="120" value="">2:00 am</option>
                      <option data-value="180" value="">3:00 am</option><option data-value="240" value="">4:00 am</option><option data-value="300" value="">5:00 am</option>
                      <option data-value="360" value="">6:00 am</option><option data-value="420" value="">7:00 am</option><option data-value="480" value="">8:00 am</option>
                      <option data-value="540" value="" selected>9:00 am</option><option data-value="600" value="">10:00 am</option><option data-value="660" value="">11:00 am</option>
                      <option data-value="720" value="">12:00 pm</option><option data-value="780" value="">1:00 pm</option><option data-value="840" value="">2:00 pm</option>
                      <option data-value="900" value="">3:00 pm</option><option data-value="960" value="">4:00 pm</option><option data-value="1020" value="">5:00 pm</option>
                      <option data-value="1080" value="">6:00 pm</option><option data-value="1140" value="">7:00 pm</option><option data-value="1200" value="">8:00 pm</option>
                      <option data-value="1260" value="">9:00 pm</option><option data-value="1320" value="">10:00 pm</option><option data-value="1380" value="">11:00 pm</option>
                    </select></label>
                  <label class="f"><span class="lab">Ends at</span>
                    <select data-role="end">
                      <option data-value="0" value="">12:00 am</option><option data-value="60" value="">1:00 am</option><option data-value="120" value="">2:00 am</option>
                      <option data-value="180" value="">3:00 am</option><option data-value="240" value="">4:00 am</option><option data-value="300" value="">5:00 am</option>
                      <option data-value="360" value="">6:00 am</option><option data-value="420" value="">7:00 am</option><option data-value="480" value="">8:00 am</option>
                      <option data-value="540" value="">9:00 am</option><option data-value="600" value="">10:00 am</option><option data-value="660" value="">11:00 am</option>
                      <option data-value="720" value="">12:00 pm</option><option data-value="780" value="">1:00 pm</option><option data-value="840" value="">2:00 pm</option>
                      <option data-value="900" value="">3:00 pm</option><option data-value="960" value="">4:00 pm</option><option data-value="1020" value="" selected>5:00 pm</option>
                      <option data-value="1080" value="">6:00 pm</option><option data-value="1140" value="">7:00 pm</option><option data-value="1200" value="">8:00 pm</option>
                      <option data-value="1260" value="">9:00 pm</option><option data-value="1320" value="">10:00 pm</option><option data-value="1380" value="">11:00 pm</option>
                    </select></label>
                </div>
                <div class="small muted" data-role="summary"></div>
              </collection-adder-form>
            </div>

            <div class="card">
              <h2>Block out a day</h2>
              <div class="sub">Overrides your weekly pattern for a single date.</div>
              <collection-adder-form
                class="notice"
                collection-type="Availability"
                model-values="accountId={{socket.authToken ? socket.authToken.accountId : ''}},clinicianId={{Clinician.id}},kind=dayOff,startMinuteOfDay:number=0,endMinuteOfDay:number=1440,active:boolean=true"
                computable-model-values
                success-message="Day blocked — it is now in your schedule above."
                show-field-errors
              >
                <div slot="message"></div>
                <div class="grid2">
                  <label class="f"><span class="lab">Date (epoch ms, local midnight)</span>
                    <input type="number" name="date" output-type="number" placeholder="1790000000000"></label>
                  <label class="f"><span class="lab">&nbsp;</span>
                    <input class="btn" type="submit" value="Block this day"></label>
                </div>
                <div class="small muted">A date picker replaces this once the worker handles timezone conversion.</div>
              </collection-adder-form>
            </div>
          </template>
          <template slot="no-item"><div class="card"><p class="muted">No profile yet — <a href="#/clinician">create one</a>.</p></div></template>
          <template slot="error"><div class="err">{{$Clinician.error.message}}</div></template>
          <div slot="viewport"></div>
        </collection-viewer>
      </div>
    </template>

    <!-- ============================ PAYOUTS ============================ -->
    <template slot="page" route-path="/clinician/payouts" no-auth-redirect="/clinician">
      <div class="wrap">
        <h1>Payout details</h1>
        <p class="muted">Where your share goes after each completed consultation.
           We pay out 24 hours after the appointment ends.</p>

        <collection-viewer
          collection-type="Clinician"
          collection-fields="accountId"
          collection-view="accountView"
          collection-view-params="accountId={{socket.authToken ? socket.authToken.accountId : ''}}"
          collection-view-primary-fields="accountId"
          collection-page-size="1"
        >
          <template slot="item">
            <div class="card">
              <h2>Status</h2>
              <p>Current payout status:
                <strong><model-text model-type="Clinician" model-id="{{Clinician.id}}"
                  model-field="payoutStatus" default-value="none"></model-text></strong></p>
              <div class="note">
                <strong>Not wired up yet.</strong> Bank details go straight to our payment provider
                and are exchanged for a token — the account number itself is never stored on our
                side. This form is inert until the backend worker exists.
              </div>
              <div class="grid2">
                <label class="f"><span class="lab">Account name</span>
                  <input type="text" placeholder="Sarah Chen" disabled></label>
                <label class="f"><span class="lab">BSB</span>
                  <input type="text" placeholder="062-000" disabled></label>
                <label class="f"><span class="lab">Account number</span>
                  <input type="text" placeholder="12345678" disabled></label>
                <label class="f"><span class="lab">&nbsp;</span>
                  <button class="btn" disabled>Save payout details</button></label>
              </div>
            </div>

            <div class="card">
              <h2>How you get paid</h2>
              <table class="plain">
                <tr><th>Patient pays</th><td>In full at the time of booking</td></tr>
                <tr><th>Platform fee</th><td>15% of the consultation fee</td></tr>
                <tr><th>You receive</th><td>The remaining 85%, less nothing else</td></tr>
                <tr><th>When</th><td>24 hours after the consultation ends, once attendance is recorded</td></tr>
                <tr><th>If the patient does not attend</th><td>You are still paid — your time was reserved</td></tr>
              </table>
            </div>
          </template>
          <template slot="no-item"><div class="card"><p class="muted">No profile yet — <a href="#/clinician">create one</a>.</p></div></template>
          <div slot="viewport"></div>
        </collection-viewer>
      </div>
    </template>

    <!-- ============================ ADMIN REVIEW QUEUE ============================ -->
    <template slot="page" route-path="/admin/reviews" no-auth-redirect="/clinician">
      <div class="wrap">
        <h1>Review control panel</h1>

        <!-- Membership of the admin Group is what grants access here. The same
             group id is on every Document, so Saasufy enforces it server-side
             too: reading the supporting document and updating the review fields
             both check groupMemberships against Document.groupId. -->
        <if-group show-content="{{!(socket.authToken && socket.authToken.groupMemberships && socket.authToken.groupMemberships.includes('620af869-cb09-4a20-bcf4-ed10510b3367'))}}">
          <template slot="content">
            <div class="card">
              <h2>Not authorised</h2>
              <p class="muted">This page is for reviewers. Your account is not a member of the
                 admin group, so the platform will not release documents to you.</p>
              <a class="btn sec" href="#/dashboard">Back to your dashboard</a>
            </div>
          </template>
          <div slot="viewport"></div>
        </if-group>

        <if-group show-content="{{!!socket.authToken && !!socket.authToken.groupMemberships && socket.authToken.groupMemberships.includes('620af869-cb09-4a20-bcf4-ed10510b3367')}}">
          <template slot="content">
        <p class="muted">Approve or reject submitted qualifications. Confirm the name on the
           document matches the name on the practitioner's payout account before approving.</p>

        <div class="card">
          <div class="sechead"><h2>Practitioner listings</h2></div>
          <div class="sub">Marking a practitioner <code>listed</code> puts them into patient
            search immediately — search is indexed on this field, so there is nothing else to
            update.</div>
          <div class="toolbar">
            <input-provider
              type="select"
              options="Draft=draft,In review=pending_review,Listed=listed,Suspended=suspended"
              value="pending_review"
              consumers=".listing-results:collection-view-params"
              provider-template="listingStatus={{value}}"
            ></input-provider>
          </div>
          <collection-viewer
            class="listing-results"
            collection-type="Clinician"
            collection-fields="displayName,professionalTitle,city,region,contactEmail"
            collection-view="reviewQueueView"
            collection-view-params="listingStatus=pending_review"
            collection-view-primary-fields="listingStatus"
            collection-page-size="25"
            auto-reset-page-offset
          >
            <template slot="item">
              <div class="row">
                <div class="grow">
                  <div class="t"><a href="#/p/{{Clinician.id}}">{{Clinician.displayName}}</a></div>
                  <div class="d">{{Clinician.professionalTitle}} · {{Clinician.city}}, {{Clinician.region}}</div>
                  <div class="d small">{{Clinician.contactEmail}}</div>
                </div>
                <div style="min-width:210px">
                  <label class="f" style="margin:0"><span class="lab">Listing status</span>
                    <model-input type="select" options="draft,pending_review,listed,suspended"
                      model-type="Clinician" model-id="{{Clinician.id}}"
                      model-field="listingStatus" show-error-message></model-input></label>
                  <label class="f" style="margin:8px 0 0"><span class="lab">Note to practitioner</span>
                    <model-input type="text" model-type="Clinician" model-id="{{Clinician.id}}"
                      model-field="listingNote" placeholder="Reason, if not listing"
                      show-error-message></model-input></label>
                </div>
              </div>
            </template>
            <template slot="no-item"><div class="empty">No practitioners with that status.</div></template>
            <template slot="loader"><div class="spin">Loading…</div></template>
            <template slot="error"><div class="err">{{$Clinician.error.message}}</div></template>
            <div slot="viewport"></div>
          </collection-viewer>
        </div>

        <div class="card">
          <div class="sechead"><h2>Pending</h2></div>
          <collection-viewer
            collection-type="Document"
            type-alias="Doc"
            collection-fields="type,institution,documentName,yearAwarded,clinicianId,registrationNumber"
            collection-view="reviewQueueView"
            collection-view-params="reviewStatus=pending"
            collection-view-primary-fields="reviewStatus"
            collection-page-size="25"
          >
            <template slot="item">
              <div class="row">
                <div class="grow">
                  <div class="t">{{Doc.documentName}}</div>
                  <div class="d">{{Doc.institution}} · {{Doc.yearAwarded}} · {{Doc.type}}</div>
                  <div class="d small">Registration no. {{Doc.registrationNumber}}</div>
                  <div class="d small">
                    Practitioner: <a href="#/p/{{Doc.clinicianId}}"><model-text
                      model-type="Clinician" model-id="{{Doc.clinicianId}}"
                      model-field="displayName" default-value="View practitioner"></model-text></a> ·
                    <a href="https://sid8016.saasufy.com/files/Document/{{Doc.id}}/document"
                       target="_blank" rel="noopener">Supporting document</a>
                  </div>
                </div>
                <div style="min-width:210px">
                  <label class="f" style="margin:0"><span class="lab">Decision</span>
                    <model-input type="select" options="pending,approved,rejected"
                      model-type="Document" model-id="{{Doc.id}}"
                      model-field="reviewStatus" show-error-message></model-input></label>
                  <label class="f" style="margin:8px 0 0"><span class="lab">Note to practitioner</span>
                    <model-input type="text" model-type="Document" model-id="{{Doc.id}}"
                      model-field="reviewNote" placeholder="Optional" show-error-message></model-input></label>
                </div>
              </div>
            </template>
            <template slot="no-item"><div class="empty">Nothing waiting for review.</div></template>
            <template slot="loader"><div class="spin">Loading queue…</div></template>
            <template slot="error"><div class="err">{{$Doc.error.message}}</div></template>
            <div slot="viewport"></div>
          </collection-viewer>
        </div>

        <div class="card">
          <div class="sechead"><h2>Recently approved</h2></div>
          <collection-viewer
            collection-type="Document"
            type-alias="Doc"
            collection-fields="documentName,institution,yearAwarded"
            collection-view="reviewQueueView"
            collection-view-params="reviewStatus=approved"
            collection-view-primary-fields="reviewStatus"
            collection-page-size="10"
          >
            <template slot="item">
              <div class="row">
                <div class="grow">
                  <div class="t">{{Doc.documentName}}</div>
                  <div class="d">{{Doc.institution}} · {{Doc.yearAwarded}}</div>
                </div>
                <span class="pill ok">approved</span>
              </div>
            </template>
            <template slot="no-item"><div class="empty">None yet.</div></template>
            <template slot="error"><div class="err">{{$Doc.error.message}}</div></template>
            <div slot="viewport"></div>
          </collection-viewer>
        </div>
          </template>
          <div slot="viewport"></div>
        </if-group>
      </div>
    </template>

    <!-- ============================ OAUTH CALLBACK ============================ -->
    <template slot="page" route-path="/auth/callback">
      <div class="wrap">
        <div class="card">
          <h2>Signing you in…</h2>
          <p class="muted">Completing authentication with Keycloak.</p>
          <oauth-handler
            provider="keycloak:dev"
            redirect-uri="http://localhost:8100/index.html"
            success-url="http://localhost:8100/index.html#/dashboard"
            auth-timeout="15000"
          ></oauth-handler>
          <p class="small muted">If you are not redirected, <a href="#/dashboard">go to your dashboard</a>.</p>
        </div>
      </div>
    </template>

    <!-- A patient who signed up mid-booking comes back here instead, and is sent on
         to the payment step rather than to a dashboard. Which of the two callbacks
         Keycloak's redirect lands on is decided by the script near the top of this
         file, from whether a booking is being held. -->
    <template slot="page" route-path="/auth/callback/booking">
      <div class="wrap">
        <div class="card">
          <h2>Setting up your account…</h2>
          <p class="muted">One moment — we are taking you to the payment step.</p>
          <oauth-handler
            provider="keycloak:dev"
            redirect-uri="http://localhost:8100/index.html"
            success-url="http://localhost:8100/index.html#/booking/resume"
            auth-timeout="15000"
          ></oauth-handler>
          <p class="small muted">If nothing happens, <a href="#/browse">start again from
             the practitioner list</a>.</p>
        </div>
      </div>
    </template>

    <!-- ============================ 404 ============================ -->
    <template slot="page" route-path="/not-found">
      <div class="wrap">
        <h1>Page not found</h1>
        <p class="muted"><a href="#/">Back to home</a></p>
      </div>
    </template>

    <div slot="viewport"></div>
  </app-router>
  </main>

</socket-provider>


</body>
</html>
